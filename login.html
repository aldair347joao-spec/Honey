<!DOCTYPE html><html lang="pt-PT"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Honey IA — Entrar</title>

<meta
    name="description"
    content="Entre na Honey IA Studio e aceda ao seu Workspace inteligente."
>

<meta
    name="theme-color"
    content="#07080a"
>

<meta
    name="color-scheme"
    content="dark"
>


<!-- ======================================================
     FONTS
====================================================== -->

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>


<!-- ======================================================
     FONT AWESOME
====================================================== -->

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>


<!-- ======================================================
     HONEY IA GLOBAL STYLE
====================================================== -->

<link
    rel="stylesheet"
    href="style.css"
>


<!-- ======================================================
     HONEY IA AUTH STYLE
====================================================== -->

<link
    rel="stylesheet"
    href="login.css"
>

</head><body class="honey-auth-page"><!-- ======================================================
     AUTH APPLICATION
====================================================== -->

<main
    id="loginApp"
    class="login-app"
    aria-label="Autenticação Honey IA"
></main>


<!-- ======================================================
     LOGIN CONTROLLER
====================================================== -->

<script
    type="module"
>

    import logincontroller from "./login.js";


    /*
    ======================================================
    INITIALIZE HONEY IA AUTHENTICATION
    ======================================================
    */

    document.addEventListener(
        "DOMContentLoaded",
        async () => {

            try {

                await logincontroller.init();

            }

            catch (error) {

                console.error(
                    "HONEY IA LOGIN INITIALIZATION ERROR:",
                    error
                );

            }

        }
    );

</script>

</body></html>
