<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagamento — Honey Pay</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111827;font-family:Inter,system-ui,sans-serif}.wrap{width:min(560px,calc(100% - 28px));margin:42px auto}.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:28px;box-shadow:0 18px 50px #0000000d}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.logo{width:42px;height:42px;border-radius:13px;background:#f5c542;display:grid;place-items:center;color:#111;font-size:22px}.muted{color:#707783;line-height:1.55}.amount{font-size:36px;font-weight:900;margin:18px 0}.form{display:grid;gap:12px}.form label{font-size:13px;font-weight:800}.form input,.form select{padding:13px;border:1px solid #dfe2e7;border-radius:11px;width:100%}.primary{border:0;background:#111827;color:#fff;padding:14px;border-radius:11px;font-weight:900;cursor:pointer}.message{margin-top:15px;padding:13px;border-radius:11px;background:#f2f4f7;line-height:1.5}.success{background:#e9f8ef;color:#176b39}.error{background:#fdeaea;color:#a32626}.ref{margin-top:15px;padding:16px;border:1px dashed #b7bdc8;border-radius:14px;background:#fafafa}.ref strong{font-size:18px}
</style>
</head>
<body><main class="wrap"><section class="card" id="checkout">
<div class="brand"><div class="logo">H</div><div>Honey Pay<small class="muted">Pagamento seguro</small></div></div>
<div id="loading" class="muted" style="margin-top:28px">A carregar cobrança...</div>
<div id="content" style="display:none">
<p class="muted" id="merchant"></p><h1 id="title"></h1><p class="muted" id="description"></p><div class="amount" id="amount"></div>
<form id="form" class="form">
<label>Nome completo<input id="name" required autocomplete="name"></label>
<label>Email<input id="email" type="email" autocomplete="email"></label>
<label>Telemóvel<input id="mobile" inputmode="numeric" placeholder="923000000" autocomplete="tel"></label>
<label>Método<select id="method"><option value="multicaixa_express">Multicaixa Express</option><option value="multicaixa_reference">Referência Multicaixa</option></select></label>
<button class="primary" id="pay">Pagar agora</button>
</form><div id="message" class="message"></div>
</div></section></main>
<script>
'use strict';
const token=location.pathname.split('/').filter(Boolean).pop(),$=id=>document.getElementById(id);
let data=null,poll=null;
const fmt=n=>new Intl.NumberFormat('pt-AO').format(Number(n)||0)+' Kz';
async function load(){try{const r=await fetch('/api/public/payment-links/'+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw Error(d.error||'Link inválido');data=d;$('merchant').textContent=d.merchant?.businessName||'Comerciante';$('title').textContent=d.link.title;$('description').textContent=d.link.description||'';$('amount').textContent=fmt(d.link.amount);$('loading').style.display='none';$('content').style.display='block';$('message').textContent='Escolha o método e confirme os seus dados.'}catch(e){$('loading').textContent=e.message}}
function show(p,bp){$('form').style.display='none';const m=$('message');m.className='message';m.innerHTML='<strong>Pagamento criado.</strong><br>Estado: '+String(p.status||'PENDING');if(p.paymentMethod==='multicaixa_reference'){const obj=bp?.data||bp||{};const entity=obj.entity||obj.entidade||obj.reference_entity;const number=obj.reference||obj.reference_number||p.reference; m.className='message success';m.innerHTML='<strong>Use a Referência Multicaixa</strong><div class="ref">Referência<br><strong>'+String(number||p.reference)+'</strong>'+ (entity?'<br><br>Entidade<br><strong>'+String(entity)+'</strong>':'')+'<br><br>Valor<br><strong>'+fmt(p.amount)+'</strong></div><br>A confirmação final será feita automaticamente.'}else{$('message').className='message';$('message').innerHTML='Abra o Multicaixa Express e confirme o pagamento no seu telemóvel. <br><br><strong>A aguardar confirmação...</strong>'}watch(p)}
async function watch(p){clearInterval(poll);let done=false;const check=async()=>{try{const r=await fetch('/api/public/payments/'+encodeURIComponent(p.id));const d=await r.json();if(!d.success)return;const s=String(d.payment.status||'').toUpperCase();if(s==='PAID'){done=true;$('message').className='message success';$('message').innerHTML='<strong>Pagamento confirmado.</strong><br>Obrigado. A cobrança foi marcada como paga.'}else if(['FAILED','CANCELLED','REFUNDED'].includes(s)){done=true;$('message').className='message error';$('message').textContent='O pagamento não foi concluído. Estado: '+s}if(done)clearInterval(poll)}catch{}};await check();poll=setInterval(check,2500)}
$('form').addEventListener('submit',async e=>{e.preventDefault();const b=$('pay');b.disabled=true;b.textContent='A processar...';$('message').textContent='A criar pagamento seguro...';try{const r=await fetch('/api/public/payment-links/'+encodeURIComponent(token)+'/pay',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({paymentMethod:$('method').value,customerName:$('name').value,customerEmail:$('email').value,customerMobile:$('mobile').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível criar o pagamento.');show(d.payment,d.bitpay)}catch(e){$('message').className='message error';$('message').textContent=e.message;b.disabled=false;b.textContent='Tentar novamente'}});
load();
</script>
</body></html>
