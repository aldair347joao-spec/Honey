<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>Pagamento — Honey Pay</title>

  <meta
    name="description"
    content="Pagamento seguro processado pela Honey Pay."
  >

  <style>
    /* =====================================================
       HONEY PAY CHECKOUT
       PREMIUM CHECKOUT V2
       ===================================================== */

    :root {
      --navy: #08111f;
      --navy-2: #101c2e;
      --gold: #f5b800;
      --gold-2: #ffc928;
      --gold-soft: #fff8dc;

      --bg: #f3f6fa;
      --card: #ffffff;
      --text: #101828;
      --text-2: #344054;
      --muted: #667085;

      --border: #e4e8ef;
      --border-strong: #d4dae4;

      --green: #12b76a;
      --green-soft: #ecfdf3;

      --red: #f04438;
      --red-soft: #fef3f2;

      --orange: #f79009;
      --orange-soft: #fffaeb;

      --shadow:
        0 25px 70px rgba(16,24,40,.12),
        0 5px 20px rgba(16,24,40,.045);

      --radius: 22px;

      --font:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      --heading:
        "Plus Jakarta Sans",
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 25px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;

      font-family: var(--font);
      color: var(--text);

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(245,184,0,.13),
          transparent 34%
        ),
        radial-gradient(
          circle at 0% 60%,
          rgba(46,144,250,.035),
          transparent 28%
        ),
        var(--bg);

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =====================================================
       WRAPPER
       ===================================================== */

    .wrap {
      width: min(590px, 100%);
      margin: 20px auto;
    }

    .card {
      position: relative;
      overflow: hidden;

      border: 1px solid rgba(255,255,255,.9);
      border-radius: var(--radius);

      background: rgba(255,255,255,.97);

      box-shadow: var(--shadow);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .card::before {
      content: "";

      position: absolute;
      inset: 0 0 auto 0;

      height: 4px;

      background:
        linear-gradient(
          90deg,
          var(--gold),
          var(--gold-2),
          var(--gold)
        );
    }

    .checkout-inner {
      padding: 30px;
    }

    /* =====================================================
       BRAND
       ===================================================== */

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 27px;
    }

    .brand-icon {
      width: 43px;
      height: 43px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      color: var(--navy);

      background:
        linear-gradient(
          145deg,
          var(--gold-2),
          var(--gold)
        );

      font-size: 21px;

      box-shadow:
        0 9px 24px rgba(245,184,0,.22);
    }

    .brand-name {
      font-family: var(--heading);
      font-size: 17px;
      font-weight: 850;
      letter-spacing: -.03em;
    }

    .brand-subtitle {
      margin-top: 2px;
      color: var(--muted);
      font-size: 8px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    /* =====================================================
       LOADING
       ===================================================== */

    .loading {
      min-height: 220px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      color: var(--muted);

      font-size: 11px;
    }

    .loading-spinner {
      width: 35px;
      height: 35px;

      margin-bottom: 14px;

      border: 3px solid #eef1f5;
      border-top-color: var(--gold);

      border-radius: 50%;

      animation:
        spin .75s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =====================================================
       MERCHANT / TITLE
       ===================================================== */

    .merchant {
      margin: 0 0 7px;

      color: #a47700;

      font-size: 9px;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: .10em;
    }

    h1 {
      margin: 0;

      font-family: var(--heading);
      font-size: 25px;
      line-height: 1.22;

      letter-spacing: -.045em;
    }

    .description {
      margin: 9px 0 0;

      color: var(--muted);

      font-size: 11px;
      line-height: 1.65;
    }

    /* =====================================================
       AMOUNT
       ===================================================== */

    .amount-box {
      position: relative;
      overflow: hidden;

      margin: 22px 0;

      padding: 20px;

      border:
        1px solid #f1df9e;

      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          #fffdf3,
          #fff8dc
        );
    }

    .amount-box::after {
      content: "";

      position: absolute;

      width: 130px;
      height: 130px;

      right: -55px;
      top: -65px;

      border-radius: 50%;

      background:
        rgba(245,184,0,.08);
    }

    .amount-label {
      color: #9a7300;

      font-size: 8px;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: .10em;
    }

    .amount {
      position: relative;
      z-index: 1;

      margin-top: 7px;

      font-family: var(--heading);

      font-size: 34px;
      line-height: 1;

      font-weight: 900;

      letter-spacing: -.055em;
    }

    /* =====================================================
       PRODUCT
       ===================================================== */

    .product {
      padding: 17px;
      margin: 19px 0;

      border: 1px solid var(--border);
      border-radius: 14px;

      background: #fafbfd;
    }

    .product-name {
      color: var(--text);

      font-family: var(--heading);

      font-size: 11px;
      font-weight: 800;
    }

    .product-description {
      margin-top: 5px;

      color: var(--muted);

      font-size: 9px;
      line-height: 1.55;
    }

    /* =====================================================
       QR
       ===================================================== */

    .qr-section {
      padding: 19px;
      margin: 21px 0;

      text-align: center;

      border: 1px solid var(--border);
      border-radius: 17px;

      background:
        linear-gradient(
          180deg,
          #ffffff,
          #fafbfd
        );
    }

    .qr-title {
      margin-bottom: 5px;

      font-family: var(--heading);

      font-size: 11px;
      font-weight: 800;
    }

    .qr-subtitle {
      margin-bottom: 14px;

      color: var(--muted);

      font-size: 8px;
    }

    #qrContainer {
      width: 238px;
      height: 238px;

      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 9px;

      border:
        1px solid var(--border);

      border-radius: 15px;

      background: white;

      box-shadow:
        0 8px 24px rgba(16,24,40,.06);
    }

    #qrContainer img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;

      border-radius: 8px;
    }

    .qr-note {
      margin: 12px 0 0;

      color: var(--muted);

      font-size: 8px;
      line-height: 1.5;
    }

    /* =====================================================
       FORM
       ===================================================== */

    #paymentForm {
      margin-top: 22px;
    }

    .field {
      margin-top: 14px;
    }

    .field:first-child {
      margin-top: 0;
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: var(--text-2);

      font-size: 9px;
      font-weight: 750;
    }

    input,
    select {
      width: 100%;
      min-height: 44px;

      padding: 0 13px;

      border: 1px solid var(--border-strong);
      border-radius: 10px;

      outline: none;

      color: var(--text);

      background: #fff;

      font-size: 10px;

      transition:
        border-color .16s ease,
        box-shadow .16s ease,
        background .16s ease;
    }

    input::placeholder {
      color: #b3bbc8;
    }

    input:hover,
    select:hover {
      border-color: #c7ced9;
    }

    input:focus,
    select:focus {
      border-color: var(--gold);

      background: #fffef8;

      box-shadow:
        0 0 0 4px rgba(245,184,0,.11);
    }

    select {
      cursor: pointer;

      appearance: none;

      background-image:
        linear-gradient(
          45deg,
          transparent 50%,
          #667085 50%
        ),
        linear-gradient(
          135deg,
          #667085 50%,
          transparent 50%
        );

      background-position:
        calc(100% - 15px) 18px,
        calc(100% - 11px) 18px;

      background-size:
        4px 4px,
        4px 4px;

      background-repeat: no-repeat;

      padding-right: 35px;
    }

    /* =====================================================
       PAY BUTTON
       ===================================================== */

    #payButton {
      position: relative;

      width: 100%;
      min-height: 48px;

      margin-top: 21px;

      padding: 0 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid var(--gold);
      border-radius: 12px;

      color: var(--navy);

      background:
        linear-gradient(
          135deg,
          var(--gold-2),
          var(--gold)
        );

      font-family: var(--heading);

      font-size: 11px;
      font-weight: 850;

      box-shadow:
        0 9px 24px rgba(245,184,0,.19),
        inset 0 1px 0 rgba(255,255,255,.28);

      transition:
        transform .16s ease,
        box-shadow .16s ease,
        filter .16s ease;
    }

    #payButton:hover:not(:disabled) {
      filter: brightness(1.035);

      transform: translateY(-1px);

      box-shadow:
        0 12px 30px rgba(245,184,0,.25),
        inset 0 1px 0 rgba(255,255,255,.3);
    }

    #payButton:active:not(:disabled) {
      transform: translateY(1px);
    }

    #payButton:disabled {
      opacity: .55;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* =====================================================
       MESSAGES
       ===================================================== */

    .message {
      margin-top: 14px;

      font-size: 9px;
      line-height: 1.55;
    }

    .message.error {
      padding: 11px 12px;

      border: 1px solid #fecdca;
      border-radius: 10px;

      color: #b42318;

      background: var(--red-soft);
    }

    .message.success {
      padding: 13px;

      border: 1px solid #abefc6;
      border-radius: 12px;

      color: #067647;

      background: var(--green-soft);
    }

    .message.warning {
      padding: 11px 12px;

      border: 1px solid #fedf89;
      border-radius: 10px;

      color: #b54708;

      background: var(--orange-soft);
    }

    /* =====================================================
       PAYMENT STATUS
       ===================================================== */

    .status-box {
      margin-top: 11px;

      padding: 13px;

      border: 1px solid var(--border);
      border-radius: 11px;

      color: var(--text-2);

      background: #fafbfd;

      font-size: 9px;
      line-height: 1.6;
    }

    .status-box.success {
      border-color: #abefc6;
      color: #067647;
      background: var(--green-soft);
    }

    .status-box.error {
      border-color: #fecdca;
      color: #b42318;
      background: var(--red-soft);
    }

    .status-box.warning {
      border-color: #fedf89;
      color: #b54708;
      background: var(--orange-soft);
    }

    .status-box a {
      display: inline-flex;

      margin-top: 2px;

      color: #a47700;

      font-weight: 800;

      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* =====================================================
       REFERENCE
       ===================================================== */

    .reference {
      margin-top: 12px;

      padding: 17px;

      border: 1px solid #f1df9e;
      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          #fffdf3,
          #fff8dc
        );
    }

    .reference > strong {
      font-family: var(--heading);

      font-size: 10px;
    }

    .reference-row {
      margin-top: 12px;
    }

    .reference-label {
      color: #9a7300;

      font-size: 8px;
      font-weight: 750;

      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .reference-value {
      margin-top: 4px;

      color: var(--text);

      font-family: var(--heading);

      font-size: 19px;
      font-weight: 850;

      word-break: break-word;
    }

    /* =====================================================
       SECURE
       ===================================================== */

    .secure {
      margin-top: 17px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 6px;

      color: #7b8797;

      font-size: 8px;
      font-weight: 600;
    }

    .secure::before {
      content: "✓";

      width: 18px;
      height: 18px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      color: #067647;
      background: var(--green-soft);

      font-size: 9px;
      font-weight: 900;
    }

    /* =====================================================
       FOOTER
       ===================================================== */

    .footer {
      padding: 17px 0 0;

      text-align: center;

      color: #98a2b3;

      font-size: 8px;
    }

    /* =====================================================
       LOAD ERROR
       ===================================================== */

    #loadError {
      padding: 15px;

      border: 1px solid #fecdca;
      border-radius: 12px;

      color: #b42318;

      background: var(--red-soft);

      font-size: 10px;
      line-height: 1.55;
    }

    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .wrap {
        width: 100%;
        margin: 8px auto;
      }

      .checkout-inner {
        padding: 22px 18px;
      }

      h1 {
        font-size: 22px;
      }

      .amount {
        font-size: 31px;
      }

      #qrContainer {
        width: 215px;
        height: 215px;
      }
    }

    @media (max-width: 380px) {
      body {
        padding: 0;
      }

      .wrap {
        margin: 0;
      }

      .card {
        min-height: 100vh;
        border: 0;
        border-radius: 0;
      }

      .checkout-inner {
        padding: 21px 15px;
      }

      .amount {
        font-size: 28px;
      }

      #qrContainer {
        width: 195px;
        height: 195px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <div class="wrap">

    <div
      class="card"
      id="checkout"
    >

      <div class="checkout-inner">

        <!-- BRAND -->

        <div class="brand">

          <div class="brand-icon">
            🍯
          </div>

          <div>
            <div class="brand-name">
              Honey Pay
            </div>

            <div class="brand-subtitle">
              Pagamento seguro
            </div>
          </div>

        </div>

        <!-- LOADING -->

        <div
          id="loading"
          class="loading"
        >
          <div class="loading-spinner"></div>
          <div>
            A carregar pagamento...
          </div>
        </div>

        <!-- CHECKOUT CONTENT -->

        <div
          id="checkoutContent"
          class="hidden"
        >

          <p
            id="merchant"
            class="merchant"
          >
            A carregar...
          </p>

          <h1 id="title">
            Pagamento
          </h1>

          <p
            id="description"
            class="description"
          ></p>

          <!-- PRODUCT -->

          <div
            id="product"
            class="product hidden"
          >

            <div
              id="productName"
              class="product-name"
            ></div>

            <div
              id="productDescription"
              class="product-description"
            ></div>

          </div>

          <!-- AMOUNT -->

          <div class="amount-box">

            <div class="amount-label">
              Valor a pagar
            </div>

            <div
              id="amount"
              class="amount"
            >
              ...
            </div>

          </div>

          <!-- QR -->

          <div
            id="qrSection"
            class="qr-section"
          >

            <div class="qr-title">
              Pague através do QR Code
            </div>

            <div class="qr-subtitle">
              Abra a câmara do seu telefone e leia o código.
            </div>

            <div
              id="qrContainer"
            ></div>

            <p class="qr-note">
              O QR Code abre este pagamento Honey Pay.
            </p>

          </div>

          <!-- FORM -->

          <form id="paymentForm">

            <div class="field">

              <label for="customerName">
                Nome completo
              </label>

              <input
                id="customerName"
                name="customerName"
                autocomplete="name"
                placeholder="Digite o seu nome"
                required
              >

            </div>

            <div class="field">

              <label for="customerEmail">
                Email
              </label>

              <input
                id="customerEmail"
                name="customerEmail"
                type="email"
                autocomplete="email"
                placeholder="exemplo@email.com"
              >

            </div>

            <div class="field">

              <label for="customerMobile">
                Telefone
              </label>

              <input
                id="customerMobile"
                name="customerMobile"
                inputmode="tel"
                autocomplete="tel"
                placeholder="923 000 000"
              >

            </div>

            <div class="field">

              <label for="paymentMethod">
                Método de pagamento
              </label>

              <select
                id="paymentMethod"
                name="paymentMethod"
              >

                <option value="multicaixa_express">
                  Multicaixa Express
                </option>

                <option value="multicaixa_reference">
                  Referência Multicaixa
                </option>

              </select>

            </div>

            <button
              id="payButton"
              type="submit"
            >
              Pagar agora
            </button>

          </form>

          <!-- MESSAGE -->

          <div
            id="message"
            class="message"
          ></div>

          <div class="secure">
            Pagamento processado de forma segura
          </div>

        </div>

        <div
          id="footer"
          class="footer"
        >
          Powered by Honey Pay
        </div>

      </div>

    </div>

  </div>

<script>
"use strict";

/* =========================================================
   HONEY PAY CHECKOUT
   FUNCTIONAL PAYMENT FLOW
   ========================================================= */

const pathParts =
  location.pathname
    .split("/")
    .filter(Boolean);

const token =
  pathParts.length
    ? pathParts[pathParts.length - 1]
    : "";

const $ = (id) =>
  document.getElementById(id);

let paymentData = null;
let currentPayment = null;
let pollingTimer = null;
let pollingAttempts = 0;

const MAX_POLLING_ATTEMPTS = 120;
const INITIAL_POLLING_INTERVAL = 3000;
const ERROR_POLLING_INTERVAL = 5000;

/* =========================================================
   HELPERS
   ========================================================= */

function formatKz(value) {
  const number = Number(value || 0);

  return (
    new Intl.NumberFormat("pt-AO")
      .format(number) +
    " Kz"
  );
}

function escapeHTML(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function normalizeStatus(status) {
  return String(status || "")
    .trim()
    .toUpperCase();
}

function statusLabel(status) {
  const normalized = normalizeStatus(status);

  const map = {
    PENDING:
      "A aguardar pagamento",

    PAYMENT_PENDING:
      "A aguardar pagamento",

    PROCESSING:
      "Pagamento em processamento",

    PAYMENT_PROCESSING:
      "Pagamento em processamento",

    SUCCEEDED:
      "Pagamento confirmado",

    SUCCESS:
      "Pagamento confirmado",

    PAID:
      "Pagamento confirmado",

    FAILED:
      "Pagamento falhou",

    EXPIRED:
      "Pagamento expirado",

    CANCELLED:
      "Pagamento cancelado",

    REFUNDED:
      "Pagamento reembolsado"
  };

  return (
    map[normalized] ||
    "A confirmar pagamento"
  );
}

function isFinalStatus(status) {
  return [
    "PAID",
    "SUCCEEDED",
    "SUCCESS",
    "FAILED",
    "EXPIRED",
    "CANCELLED",
    "REFUNDED"
  ].includes(
    normalizeStatus(status)
  );
}

function showMessage(message, type) {
  const element = $("message");

  if (!element) {
    return;
  }

  element.className =
    "message " +
    (type || "");

  element.textContent =
    message || "";
}

function stopPolling() {
  if (pollingTimer) {
    clearTimeout(pollingTimer);
    pollingTimer = null;
  }
}

function schedulePolling(callback, delay) {
  stopPolling();

  pollingTimer =
    setTimeout(
      callback,
      delay
    );
}

/* =========================================================
   LOAD PAYMENT LINK
   ========================================================= */

async function loadPaymentLink() {

  if (!token) {
    showLoadError(
      "Link de pagamento inválido."
    );

    return;
  }

  try {

    const response =
      await fetch(
        `/api/public/payment-links/${encodeURIComponent(token)}`,
        {
          method: "GET",
          headers: {
            Accept:
              "application/json"
          },
          cache: "no-store"
        }
      );

    let data = null;

    try {
      data =
        await response.json();
    } catch {
      data = null;
    }

    if (!response.ok) {
      throw new Error(
        data?.error ||
        data?.message ||
        "Este link de pagamento não está disponível."
      );
    }

    paymentData = data;

    renderPaymentLink(data);

  } catch (error) {

    console.error(
      "Honey Pay checkout:",
      error
    );

    showLoadError(
      error.message ||
      "Não foi possível carregar o pagamento."
    );
  }
}

/* =========================================================
   RENDER PAYMENT LINK
   ========================================================= */

function renderPaymentLink(data) {

  const link =
    data?.link ||
    data;

  const merchant =
    data?.merchant ||
    {};

  if (!link) {

    showLoadError(
      "Pagamento não encontrado."
    );

    return;
  }

  const merchantName =
    merchant.businessName ||
    merchant.name ||
    "Honey Pay";

  $("merchant")
    .textContent =
    merchantName;

  $("title")
    .textContent =
    link.title ||
    "Pagamento";

  $("description")
    .textContent =
    link.description ||
    "";

  $("amount")
    .textContent =
    formatKz(
      link.amount
    );

  const product =
    data?.product ||
    link.product ||
    null;

  if (product) {

    $("productName")
      .textContent =
      product.name ||
      link.title ||
      "";

    $("productDescription")
      .textContent =
      product.description ||
      "";

    $("product")
      .classList
      .remove("hidden");
  }

  const paymentUrl =
    link.url ||
    `${location.origin}/pay/${encodeURIComponent(token)}`;

  renderQr(
    link.qrCode ||
    link.qrUrl ||
    paymentUrl,
    paymentUrl
  );
renderQr(
  data?.link?.qrSvg ||
  ""
);
  $("loading")
    .classList
    .add("hidden");

  $("checkoutContent")
    .classList
    .remove("hidden");
}

/* =========================================================
   QR
   ========================================================= */

function renderQr(
  qrValue
) {

  const container =
    $("qrContainer");

  if (!container) {
    return;
  }

  container.innerHTML = "";

  if (
    typeof qrValue ===
    "string" &&
    qrValue.trim()
  ) {

    const value =
      qrValue.trim();

    if (
      value.startsWith(
        "<svg"
      )
    ) {

      container.innerHTML =
        value;

      const svg =
        container.querySelector(
          "svg"
        );

      if (svg) {

        svg.removeAttribute(
          "width"
        );

        svg.removeAttribute(
          "height"
        );

        svg.style.width =
          "220px";

        svg.style.height =
          "220px";

        svg.style.maxWidth =
          "100%";
      }

      return;
    }

    if (
      value.startsWith(
        "data:image/"
      )
    ) {

      const img =
        document.createElement(
          "img"
        );

      img.src =
        value;

      img.alt =
        "QR Code BitPay";

      img.width =
        220;

      img.height =
        220;

      container.appendChild(
        img
      );

      return;
    }
  }

  container.innerHTML =
    `
      <div
        style="
          padding:20px;
          font-size:10px;
          color:#98a2b3;
          text-align:center;
        "
      >
        QR Code ainda não disponível.
      </div>
    `;
}



/* =========================================================
   CREATE PAYMENT
   ========================================================= */

async function createPayment(event) {

  event.preventDefault();

  if (!token) {

    showMessage(
      "Link de pagamento inválido.",
      "error"
    );

    return;
  }

  const button =
    $("payButton");

  button.disabled = true;
  button.textContent =
    "A processar...";

  showMessage(
    "A criar pagamento seguro...",
    ""
  );

  try {

    const customerName =
      $("customerName")
        .value
        .trim();

    const customerEmail =
      $("customerEmail")
        .value
        .trim();

    const customerMobile =
      $("customerMobile")
        .value
        .trim();

    const paymentMethod =
      $("paymentMethod")
        .value;

    if (!customerName) {

      throw new Error(
        "Introduza o seu nome."
      );
    }

    const response =
      await fetch(
        `/api/public/payment-links/${encodeURIComponent(token)}/pay`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            Accept:
              "application/json"
          },

          body:
            JSON.stringify({
              paymentMethod,
              customerName,
              customerEmail,
              customerMobile
            })
        }
      );

    let data = null;

    try {
      data =
        await response.json();
    } catch {
      data = null;
    }

    if (!response.ok) {

      throw new Error(
        data?.error ||
        data?.message ||
        "Não foi possível criar o pagamento."
      );
    }

    currentPayment =
      data?.payment ||
      data;

    if (!currentPayment) {

      throw new Error(
        "O servidor não devolveu os dados do pagamento."
      );
    }

    renderPayment(
      currentPayment
    );

    const providerPaymentId =
      currentPayment.providerPaymentId ||
      currentPayment.providerPayment?.id ||
      currentPayment.providerId ||
      null;

    if (providerPaymentId) {

      startPaymentPolling(
        providerPaymentId
      );

    } else {

      showMessage(
        "Pagamento criado. A aguardar confirmação...",
        "success"
      );
    }

  } catch (error) {

    console.error(
      "Honey Pay payment:",
      error
    );

    showMessage(
      error.message ||
      "Não foi possível processar o pagamento.",
      "error"
    );

    button.disabled = false;
    button.textContent =
      "Tentar novamente";
  }
}

/* =========================================================
   PAYMENT VIEW
   ========================================================= */

function renderPayment(payment) {

  const status =
    normalizeStatus(
      payment.status ||
      "PENDING"
    );

  let html = `
    <div class="status-box">

      <strong>
        ${escapeHTML(
          statusLabel(status)
        )}
      </strong>

      <br>

      Valor:
      <strong>
        ${formatKz(
          payment.amount
        )}
      </strong>

    </div>
  `;

  const reference =
    payment.multicaixaReference ||
    payment.reference ||
    null;

  if (
    reference &&
    (
      reference.entity ||
      reference.number ||
      reference.reference
    )
  ) {

    const entity =
      reference.entity ||
      "";

    const number =
      reference.number ||
      reference.reference ||
      "";

    html += `
      <div class="reference">

        <strong>
          Referência Multicaixa
        </strong>

        <div class="reference-row">

          <div class="reference-label">
            Entidade
          </div>

          <div class="reference-value">
            ${escapeHTML(entity)}
          </div>

        </div>

        <div class="reference-row">

          <div class="reference-label">
            Número
          </div>

          <div class="reference-value">
            ${escapeHTML(number)}
          </div>

        </div>

      </div>
    `;
  }

  if (payment.checkoutUrl) {

    html += `
      <div class="status-box">

        <a
          href="${escapeHTML(payment.checkoutUrl)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          Abrir checkout de pagamento
        </a>

      </div>
    `;
  }

  html += `
    <div
      id="liveStatus"
      class="status-box"
    >
      A aguardar confirmação do pagamento...
    </div>
  `;

  $("message")
    .className =
    "message success";

  $("message")
    .innerHTML =
    html;

  $("paymentForm")
    .classList
    .add("hidden");
}

/* =========================================================
   POLLING
   ========================================================= */
/* =========================================================
   BITPAY REAL-TIME SSE
   ========================================================= */

let paymentEventSource =
  null;

function stopPaymentSSE() {

  if (
    paymentEventSource
  ) {

    try {
      paymentEventSource.close();
    } catch {}

    paymentEventSource =
      null;
  }
}


function startPaymentSSE(
  providerPaymentId
) {

  if (
    !providerPaymentId
  ) {
    return false;
  }

  stopPaymentSSE();

  const url =
    `/api/public/payments/${encodeURIComponent(
      providerPaymentId
    )}/events`;

  try {

    const source =
      new EventSource(
        url
      );

    paymentEventSource =
      source;

    source.addEventListener(
      "payment.succeeded",
      event => {

        try {

          const provider =
            JSON.parse(
              event.data
            );

          renderLiveProviderStatus(
            provider
          );

        } catch {

          updateLiveStatus(
            "Pagamento confirmado."
          );
        }

        source.close();

        paymentEventSource =
          null;

        stopPolling();
      }
    );

    source.addEventListener(
      "payment.failed",
      event => {

        try {

          const provider =
            JSON.parse(
              event.data
            );

          renderLiveProviderStatus(
            provider
          );

        } catch {

          updateLiveStatus(
            "O pagamento falhou."
          );
        }

        source.close();

        paymentEventSource =
          null;

        stopPolling();
      }
    );

    source.addEventListener(
      "payment.reconciled",
      event => {

        try {

          const provider =
            JSON.parse(
              event.data
            );

          renderLiveProviderStatus(
            provider
          );

        } catch {}

      }
    );

    source.onerror =
      () => {

        source.close();

        paymentEventSource =
          null;

        /*
        SSE é experiência em tempo real.
        O polling continua como fallback.
        */

        startPaymentPolling(
          providerPaymentId
        );
      };

    return true;

  } catch (error) {

    console.warn(
      "SSE BitPay:",
      error
    );

    return false;
  }
}
function startPaymentPolling(
  providerPaymentId
) {

  stopPolling();

  pollingAttempts = 0;

  pollPaymentStatus(
    providerPaymentId
  );
}

async function pollPaymentStatus(
  providerPaymentId
) {

  if (!providerPaymentId) {
    return;
  }

  pollingAttempts++;

  try {

    const response =
      await fetch(
        `/api/public/payments/${encodeURIComponent(providerPaymentId)}/status`,
        {
          method: "GET",

          headers: {
            Accept:
              "application/json"
          },

          cache: "no-store"
        }
      );

    let data = null;

    try {
      data =
        await response.json();
    } catch {
      data = null;
    }

    if (!response.ok) {

      throw new Error(
        data?.error ||
        data?.message ||
        "Não foi possível consultar o pagamento."
      );
    }

    const payment =
      data?.payment ||
      data;

    if (payment) {
      currentPayment =
        payment;
    }

    const status =
      normalizeStatus(
        payment?.status
      );

    updateLiveStatus(
      status,
      payment
    );

    if (
      isFinalStatus(status)
    ) {

      stopPolling();

      handleFinalStatus(
        status,
        payment
      );

      return;
    }

    if (
      pollingAttempts <
      MAX_POLLING_ATTEMPTS
    ) {

      schedulePolling(
        () =>
          pollPaymentStatus(
            providerPaymentId
          ),
        INITIAL_POLLING_INTERVAL
      );

    } else {

      const live =
        $("liveStatus");

      if (live) {

        live.textContent =
          "O pagamento ainda está a ser confirmado. Pode manter esta página aberta.";
      }
    }

  } catch (error) {

    console.warn(
      "Honey Pay payment status:",
      error
    );

    if (
      pollingAttempts <
      MAX_POLLING_ATTEMPTS
    ) {

      schedulePolling(
        () =>
          pollPaymentStatus(
            providerPaymentId
          ),
        ERROR_POLLING_INTERVAL
      );

    } else {

      const live =
        $("liveStatus");

      if (live) {

        live.textContent =
          "Não foi possível atualizar o estado neste momento. A confirmação continua a ser processada.";
      }
    }
  }
}

/* =========================================================
   LIVE STATUS
   ========================================================= */

function updateLiveStatus(
  status,
  payment
) {

  const live =
    $("liveStatus");

  if (!live) {
    return;
  }

  if (
    status === "PAID" ||
    status === "SUCCEEDED" ||
    status === "SUCCESS"
  ) {

    live.className =
      "status-box success";

    live.innerHTML =
      "<strong>✓ Pagamento confirmado.</strong>";

    return;
  }

  if (status === "FAILED") {

    live.className =
      "status-box error";

    live.textContent =
      "O pagamento falhou.";

    return;
  }

  if (status === "EXPIRED") {

    live.className =
      "status-box warning";

    live.textContent =
      "O pagamento expirou.";

    return;
  }

  if (status === "CANCELLED") {

    live.className =
      "status-box warning";

    live.textContent =
      "O pagamento foi cancelado.";

    return;
  }

  if (status === "REFUNDED") {

    live.className =
      "status-box warning";

    live.textContent =
      "O pagamento foi reembolsado.";

    return;
  }

  if (
    status === "PROCESSING" ||
    status === "PAYMENT_PROCESSING"
  ) {

    live.className =
      "status-box";

    live.textContent =
      "Pagamento em processamento...";

    return;
  }

  live.className =
    "status-box";

  live.textContent =
    "A aguardar confirmação do pagamento...";
}

/* =========================================================
   FINAL STATUS
   ========================================================= */

function handleFinalStatus(
  status,
  payment
) {

  const normalized =
    normalizeStatus(status);

  const button =
    $("payButton");

  if (
    normalized === "PAID" ||
    normalized === "SUCCEEDED" ||
    normalized === "SUCCESS"
  ) {

    if (button) {

      button.disabled = true;

      button.textContent =
        "Pagamento confirmado";
    }

    return;
  }

  if (button) {

    button.disabled = false;

    button.textContent =
      "Tentar novamente";
  }
}

/* =========================================================
   LOAD ERROR
   ========================================================= */

function showLoadError(message) {

  $("loading")
    .classList
    .add("hidden");

  $("checkoutContent")
    .classList
    .add("hidden");

  $("footer")
    .textContent =
    "Honey Pay";

  const existing =
    $("loadError");

  if (existing) {

    existing.textContent =
      message;

    return;
  }

  const error =
    document.createElement(
      "div"
    );

  error.id =
    "loadError";

  error.textContent =
    message;

  $("checkout")
    .querySelector(".checkout-inner")
    .appendChild(error);
}

/* =========================================================
   CLEANUP
   ========================================================= */

window.addEventListener(
  "beforeunload",
  () => {
    stopPolling();
  }
);

/* =========================================================
   START
   ========================================================= */

$("paymentForm")
  .addEventListener(
    "submit",
    createPayment
  );

loadPaymentLink();
