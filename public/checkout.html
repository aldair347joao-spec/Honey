"use strict";

/* =========================================================
   CONFIG
========================================================= */

const pathParts =
  location.pathname
    .split("/")
    .filter(Boolean);

const token =
  pathParts.length
    ? pathParts[
        pathParts.length - 1
      ]
    : "";

const $ =
  (
    id
  ) =>
    document.getElementById(
      id
    );

let paymentData =
  null;

let currentPayment =
  null;

let pollingTimer =
  null;

let pollingAttempts =
  0;

const MAX_POLLING_ATTEMPTS =
  120;

const INITIAL_POLLING_INTERVAL =
  3000;

const ERROR_POLLING_INTERVAL =
  5000;

/* =========================================================
   HELPERS
========================================================= */

function formatKz(
  value
) {

  const number =
    Number(
      value || 0
    );

  return (
    new Intl.NumberFormat(
      "pt-AO"
    ).format(
      number
    ) +
    " Kz"
  );

}

function escapeHTML(
  value
) {

  return String(
    value == null
      ? ""
      : value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

function normalizeStatus(
  status
) {

  return String(
    status || ""
  )
    .trim()
    .toUpperCase();

}

function statusLabel(
  status
) {

  const normalized =
    normalizeStatus(
      status
    );

  const map = {

    PENDING:
      "A aguardar pagamento",

    PAYMENT_PENDING:
      "A aguardar pagamento",

    PROCESSING:
      "Pagamento em processamento",

    PAYMENT_PROCESSING:
      "Pagamento em processamento",

    SUCCEEDED:
      "Pagamento confirmado",

    SUCCESS:
      "Pagamento confirmado",

    PAID:
      "Pagamento confirmado",

    FAILED:
      "Pagamento falhou",

    EXPIRED:
      "Pagamento expirado",

    CANCELLED:
      "Pagamento cancelado",

    REFUNDED:
      "Pagamento reembolsado"

  };

  return (
    map[
      normalized
    ] ||
    "A confirmar pagamento"
  );

}

function isFinalStatus(
  status
) {

  const normalized =
    normalizeStatus(
      status
    );

  return [
    "PAID",
    "SUCCEEDED",
    "SUCCESS",
    "FAILED",
    "EXPIRED",
    "CANCELLED",
    "REFUNDED"
  ].includes(
    normalized
  );

}

function showMessage(
  message,
  type
) {

  const element =
    $("message");

  if (!element) {
    return;
  }

  element.className =
    "message " +
    (
      type || ""
    );

  element.textContent =
    message || "";

}

function stopPolling() {

  if (
    pollingTimer
  ) {

    clearTimeout(
      pollingTimer
    );

    pollingTimer =
      null;

  }

}

function schedulePolling(
  callback,
  delay
) {

  stopPolling();

  pollingTimer =
    setTimeout(
      callback,
      delay
    );

}

/* =========================================================
   LOAD PUBLIC PAYMENT LINK
========================================================= */

async function loadPaymentLink() {

  if (!token) {

    showLoadError(
      "Link de pagamento inválido."
    );

    return;

  }

  try {

    const response =
      await fetch(
        `/api/public/payment-links/${encodeURIComponent(
          token
        )}`,
        {
          method:
            "GET",

          headers: {
            Accept:
              "application/json"
          },

          cache:
            "no-store"
        }
      );

    let data =
      null;

    try {

      data =
        await response.json();

    } catch {

      data =
        null;

    }

    if (!response.ok) {

      throw new Error(
        data?.error ||
        data?.message ||
        "Este link de pagamento não está disponível."
      );

    }

    paymentData =
      data;

    renderPaymentLink(
      data
    );

  } catch (
    error
  ) {

    console.error(
      "Honey Pay checkout:",
      error
    );

    showLoadError(
      error.message ||
      "Não foi possível carregar o pagamento."
    );

  }

}

/* =========================================================
   RENDER PAYMENT LINK
========================================================= */

function renderPaymentLink(
  data
) {

  const link =
    data?.link ||
    data;

  const merchant =
    data?.merchant ||
    {};

  if (!link) {

    showLoadError(
      "Pagamento não encontrado."
    );

    return;

  }

  const merchantName =
    merchant.businessName ||
    merchant.name ||
    "Honey Pay";

  $("merchant")
    .textContent =
    merchantName;

  $("title")
    .textContent =
    link.title ||
    "Pagamento";

  $("description")
    .textContent =
    link.description ||
    "";

  $("amount")
    .textContent =
    formatKz(
      link.amount
    );

  /*
   Produto pode vir diretamente no
   endpoint público.
  */

  const product =
    data?.product ||
    link.product ||
    null;

  if (
    product
  ) {

    $("productName")
      .textContent =
      product.name ||
      link.title ||
      "";

    $("productDescription")
      .textContent =
      product.description ||
      "";

    $("product")
      .classList
      .remove(
        "hidden"
      );

  }

  /*
   Preferimos QR fornecido pelo backend.

   Se o backend ainda devolver apenas
   qrUrl como URL do checkout, geramos
   temporariamente o QR visual no browser.
  */

  const paymentUrl =
    link.url ||
    `${location.origin}/pay/${encodeURIComponent(
      token
    )}`;

  renderQr(
    link.qrCode ||
    link.qrUrl ||
    paymentUrl,
    paymentUrl
  );

  $("loading")
    .classList
    .add(
      "hidden"
    );

  $("checkoutContent")
    .classList
    .remove(
      "hidden"
    );

}

/* =========================================================
   QR
========================================================= */

function renderQr(
  qrValue,
  fallbackValue
) {

  const container =
    $("qrContainer");

  if (!container) {
    return;
  }

  container.innerHTML =
    "";

  /*
   Se o backend fornecer uma imagem
   real, utilizamos diretamente.
  */

  if (
    typeof qrValue ===
      "string" &&
    (
      qrValue.startsWith(
        "data:image/"
      ) ||
      qrValue.startsWith(
        "https://"
      ) ||
      qrValue.startsWith(
        "http://"
      )
    ) &&
    (
      qrValue.includes(
        ".png"
      ) ||
      qrValue.includes(
        ".svg"
      ) ||
      qrValue.startsWith(
        "data:image/"
      )
    )
  ) {

    const img =
      document.createElement(
        "img"
      );

    img.src =
      qrValue;

    img.alt =
      "QR Code de pagamento Honey Pay";

    img.loading =
      "eager";

    img.onerror =
      () => {

        renderExternalQr(
          fallbackValue
        );

      };

    container.appendChild(
      img
    );

    return;

  }

  renderExternalQr(
    fallbackValue
  );

}

function renderExternalQr(
  value
) {

  const container =
    $("qrContainer");

  if (!container) {
    return;
  }

  /*
   Compatibilidade temporária.

   O QR contém somente a URL pública
   do Honey Pay.

   O próximo passo de backend pode
   substituir isto por QR gerado
   internamente sem alterar o checkout.
  */

  const img =
    document.createElement(
      "img"
    );

  img.alt =
    "QR Code de pagamento Honey Pay";

  img.loading =
    "eager";

  img.width =
    220;

  img.height =
    220;

  img.src =
    "https://api.qrserver.com/v1/create-qr-code/?" +
    "size=300x300&data=" +
    encodeURIComponent(
      value
    );

  container.innerHTML =
    "";

  container.appendChild(
    img
  );

}

/* =========================================================
   CREATE PAYMENT
========================================================= */

async function createPayment(
  event
) {

  event.preventDefault();

  if (!token) {

    showMessage(
      "Link de pagamento inválido.",
      "error"
    );

    return;

  }

  const button =
    $("payButton");

  button.disabled =
    true;

  button.textContent =
    "A processar...";

  showMessage(
    "A criar pagamento seguro...",
    ""
  );

  try {

    const customerName =
      $("customerName")
        .value
        .trim();

    const customerEmail =
      $("customerEmail")
        .value
        .trim();

    const customerMobile =
      $("customerMobile")
        .value
        .trim();

    const paymentMethod =
      $("paymentMethod")
        .value;

    if (!customerName) {

      throw new Error(
        "Introduza o seu nome."
      );

    }

    const response =
      await fetch(
        `/api/public/payment-links/${encodeURIComponent(
          token
        )}/pay`,
        {
          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json",

            Accept:
              "application/json"
          },

          body:
            JSON.stringify({

              paymentMethod:
                paymentMethod,

              customerName:
                customerName,

              customerEmail:
                customerEmail,

              customerMobile:
                customerMobile

            })
        }
      );

    let data =
      null;

    try {

      data =
        await response.json();

    } catch {

      data =
        null;

    }

    if (!response.ok) {

      throw new Error(
        data?.error ||
        data?.message ||
        "Não foi possível criar o pagamento."
      );

    }

    currentPayment =
      data?.payment ||
      data;

    if (!currentPayment) {

      throw new Error(
        "O servidor não devolveu os dados do pagamento."
      );

    }

    renderPayment(
      currentPayment
    );

    /*
     O backend é a fonte oficial.
     Não abrimos SSE diretamente no browser.
    */

    const providerPaymentId =
      currentPayment.providerPaymentId ||
      currentPayment.providerPayment?.id ||
      currentPayment.providerId ||
      null;

    if (
      providerPaymentId
    ) {

      startPaymentPolling(
        providerPaymentId
      );

    } else {

      showMessage(
        "Pagamento criado. A aguardar confirmação...",
        "success"
      );

    }

  } catch (
    error
  ) {

    console.error(
      "Honey Pay payment:",
      error
    );

    showMessage(
      error.message ||
      "Não foi possível processar o pagamento.",
      "error"
    );

    button.disabled =
      false;

    button.textContent =
      "Tentar novamente";

  }

}

/* =========================================================
   PAYMENT VIEW
========================================================= */

function renderPayment(
  payment
) {

  const status =
    normalizeStatus(
      payment.status ||
      "PENDING"
    );

  let html = `

    <div class="status-box">

      <strong>
        ${escapeHTML(
          statusLabel(
            status
          )
        )}
      </strong>

      <br><br>

      Valor:
      <strong>
        ${formatKz(
          payment.amount
        )}
      </strong>

    </div>

  `;

  const reference =
    payment.multicaixaReference ||
    payment.reference ||
    null;

  if (
    reference &&
    (
      reference.entity ||
      reference.number ||
      reference.reference
    )
  ) {

    const entity =
      reference.entity ||
      "";

    const number =
      reference.number ||
      reference.reference ||
      "";

    html += `

      <div class="reference">

        <strong>
          Referência Multicaixa
        </strong>

        <div class="reference-row">

          <div class="reference-label">
            Entidade
          </div>

          <div class="reference-value">
            ${escapeHTML(
              entity
            )}
          </div>

        </div>

        <div class="reference-row">

          <div class="reference-label">
            Número
          </div>

          <div class="reference-value">
            ${escapeHTML(
              number
            )}
          </div>

        </div>

      </div>

    `;

  }

  if (
    payment.checkoutUrl
  ) {

    html += `

      <div
        class="status-box"
      >

        <a
          href="${escapeHTML(
            payment.checkoutUrl
          )}"
          target="_blank"
          rel="noopener noreferrer"
        >
          Abrir checkout BitPay
        </a>

      </div>

    `;

  }

  html += `

    <div
      id="liveStatus"
      class="status-box"
    >
      A aguardar confirmação do pagamento...
    </div>

  `;

  $("message")
    .className =
    "message success";

  $("message")
    .innerHTML =
    html;

  $("paymentForm")
    .classList
    .add(
      "hidden"
    );

}

/* =========================================================
   POLLING
========================================================= */

function startPaymentPolling(
  providerPaymentId
) {

  stopPolling();

  pollingAttempts =
    0;

  pollPaymentStatus(
    providerPaymentId
  );

}

async function pollPaymentStatus(
  providerPaymentId
) {

  if (
    !providerPaymentId
  ) {

    return;

  }

  pollingAttempts++;

  try {

    const response =
      await fetch(
        `/api/public/payments/${encodeURIComponent(
          providerPaymentId
        )}/status`,
        {
          method:
            "GET",

          headers: {
            Accept:
              "application/json"
          },

          cache:
            "no-store"
        }
      );

    let data =
      null;

    try {

      data =
        await response.json();

    } catch {

      data =
        null;

    }

    if (!response.ok) {

      throw new Error(
        data?.error ||
        data?.message ||
        "Não foi possível consultar o pagamento."
      );

    }

    const payment =
      data?.payment ||
      data;

    if (
      payment
    ) {

      currentPayment =
        payment;

    }

    const status =
      normalizeStatus(
        payment?.status
      );

    updateLiveStatus(
      status,
      payment
    );

    /*
     PAID / FAILED / EXPIRED /
     CANCELLED / REFUNDED são estados
     finais. Paramos o polling.
    */

    if (
      isFinalStatus(
        status
      )
    ) {

      stopPolling();

      handleFinalStatus(
        status,
        payment
      );

      return;

    }

    if (
      pollingAttempts <
      MAX_POLLING_ATTEMPTS
    ) {

      schedulePolling(
        () =>
          pollPaymentStatus(
            providerPaymentId
          ),
        INITIAL_POLLING_INTERVAL
      );

    } else {

      const live =
        $("liveStatus");

      if (live) {

        live.textContent =
          "O pagamento ainda está a ser confirmado. Pode manter esta página aberta.";

      }

      /*
       Não marcamos como falhado.
       O webhook pode ainda estar a processar.
      */

    }

  } catch (
    error
  ) {

    console.warn(
      "Honey Pay payment status:",
      error
    );

    if (
      pollingAttempts <
      MAX_POLLING_ATTEMPTS
    ) {

      schedulePolling(
        () =>
          pollPaymentStatus(
            providerPaymentId
          ),
        ERROR_POLLING_INTERVAL
      );

    } else {

      const live =
        $("liveStatus");

      if (live) {

        live.textContent =
          "Não foi possível atualizar o estado neste momento. A confirmação continua a ser processada.";

      }

    }

  }

}

/* =========================================================
   LIVE STATUS
========================================================= */

function updateLiveStatus(
  status,
  payment
) {

  const live =
    $("liveStatus");

  if (!live) {
    return;
  }

  if (
    status ===
      "PAID" ||
    status ===
      "SUCCEEDED" ||
    status ===
      "SUCCESS"
  ) {

    live.className =
      "status-box success";

    live.innerHTML =
      "<strong>✓ Pagamento confirmado.</strong>";

    return;

  }

  if (
    status ===
      "FAILED"
  ) {

    live.className =
      "status-box error";

    live.textContent =
      "O pagamento falhou.";

    return;

  }

  if (
    status ===
      "EXPIRED"
  ) {

    live.className =
      "status-box warning";

    live.textContent =
      "O pagamento expirou.";

    return;

  }

  if (
    status ===
      "CANCELLED"
  ) {

    live.className =
      "status-box warning";

    live.textContent =
      "O pagamento foi cancelado.";

    return;

  }

  if (
    status ===
      "REFUNDED"
  ) {

    live.className =
      "status-box warning";

    live.textContent =
      "O pagamento foi reembolsado.";

    return;

  }

  if (
    status ===
      "PROCESSING" ||
    status ===
      "PAYMENT_PROCESSING"
  ) {

    live.className =
      "status-box";

    live.textContent =
      "Pagamento em processamento...";

    return;

  }

  live.className =
    "status-box";

  live.textContent =
    "A aguardar confirmação do pagamento...";

}

/* =========================================================
   FINAL STATUS
========================================================= */

function handleFinalStatus(
  status,
  payment
) {

  const normalized =
    normalizeStatus(
      status
    );

  const button =
    $("payButton");

  if (
    normalized ===
      "PAID" ||
    normalized ===
      "SUCCEEDED" ||
    normalized ===
      "SUCCESS"
  ) {

    if (button) {

      button.disabled =
        true;

      button.textContent =
        "Pagamento confirmado";

    }

    return;

  }

  if (button) {

    button.disabled =
      false;

    button.textContent =
      "Tentar novamente";

  }

}

/* =========================================================
   LOAD ERROR
========================================================= */

function showLoadError(
  message
) {

  $("loading")
    .classList
    .add(
      "hidden"
    );

  $("checkoutContent")
    .classList
    .add(
      "hidden"
    );

  $("footer")
    .textContent =
    "Honey Pay";

  const existing =
    $("loadError");

  if (
    existing
  ) {

    existing.textContent =
      message;

    return;

  }

  const error =
    document.createElement(
      "div"
    );

  error.id =
    "loadError";

  error.className =
    "message error";

  error.textContent =
    message;

  $("checkout")
    .appendChild(
      error
    );

}

/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    stopPolling();

  }
);

/* =========================================================
   START
========================================================= */

$("paymentForm")
  .addEventListener(
    "submit",
    createPayment
  );

loadPaymentLink();
