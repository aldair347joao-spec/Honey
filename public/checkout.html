<!DOCTYPE html>
<html lang="pt">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Pagamento — Honey Pay</title>

  <style>

    * {
      box-sizing:
        border-box;
    }

    body {
      margin:
        0;

      background:
        #f5f6fa;

      font-family:
        Arial,
        sans-serif;

      color:
        #111827;
    }

    .wrap {
      width:
        min(560px, calc(100% - 30px));

      margin:
        50px auto;
    }

    .card {
      background:
        white;

      padding:
        28px;

      border-radius:
        18px;

      box-shadow:
        0 15px 50px
        rgba(0,0,0,.08);
    }

    h1 {
      margin-top:
        0;
    }

    .amount {
      font-size:
        34px;

      font-weight:
        800;

      margin:
        20px 0;
    }

    label {
      display:
        block;

      margin-top:
        12px;

      font-weight:
        600;
    }

    input,
    select {
      width:
        100%;

      padding:
        13px;

      border:
        1px solid #d1d5db;

      border-radius:
        10px;

      margin-top:
        6px;
    }

    button {
      width:
        100%;

      margin-top:
        20px;

      padding:
        14px;

      border:
        0;

      border-radius:
        10px;

      background:
        #111827;

      color:
        white;

      font-weight:
        800;

      cursor:
        pointer;
    }

    .message {
      margin-top:
        20px;

      line-height:
        1.6;
    }

    .error {
      color:
        #b91c1c;
    }

    .success {
      color:
        #047857;
    }

    .reference {
      background:
        #f3f4f6;

      padding:
        15px;

      border-radius:
        10px;

      margin-top:
        15px;
    }

  </style>

</head>

<body>

<div class="wrap">

  <div
    class="card"
    id="checkout"
  >

    <h1>
      🍯 Honey Pay
    </h1>

    <h2 id="merchant">
      A carregar...
    </h2>

    <h3 id="title">
      ...
    </h3>

    <p id="description"></p>

    <div
      class="amount"
      id="amount"
    >
      ...
    </div>
<div
  id="qrContainer"
  style="
    margin:20px auto;
    display:flex;
    justify-content:center;
    align-items:center;
  "
></div>
    <form
      id="paymentForm"
    >

      <label>
        Nome
      </label>

      <input
        id="customerName"
        required
      >

      <label>
        Email
      </label>

      <input
        id="customerEmail"
        type="email"
      >

      <label>
        Telefone
      </label>

      <input
        id="customerMobile"
        placeholder="923000000"
      >

      <label>
        Método de pagamento
      </label>

      <select
        id="paymentMethod"
        required
      >

        <option
          value="multicaixa_express"
        >
          Multicaixa Express
        </option>

        <option
          value="multicaixa_reference"
        >
          Referência Multicaixa
        </option>

      </select>

      <button
        id="payButton"
      >
        Pagar agora
      </button>

    </form>

    <div
      id="message"
      class="message"
    ></div>

  </div>

</div>

<script>

"use strict";

const token =
  location.pathname
    .split("/")
    .filter(Boolean)
    .pop();

const $ =
  (id) =>
    document.getElementById(id);

let paymentData = null;
let currentPayment = null;
let eventSource = null;

function formatKz(
  value
) {
  return (
    new Intl.NumberFormat(
      "pt-AO"
    ).format(
      Number(
        value || 0
      )
    ) +
    " Kz"
  );
}

function escapeHTML(
  value
) {
  return String(
    value || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}

function statusLabel(
  status
) {

  const map = {

    PENDING:
      "A aguardar pagamento",

    PROCESSING:
      "Pagamento em processamento",

    SUCCEEDED:
      "Pagamento confirmado",

    PAID:
      "Pagamento confirmado",

    FAILED:
      "Pagamento falhou",

    EXPIRED:
      "Pagamento expirado",

    CANCELLED:
      "Pagamento cancelado",

    UNKNOWN:
      "A confirmar pagamento"
  };

  return (
    map[
      String(
        status || ""
      ).toUpperCase()
    ] ||
    "Estado desconhecido"
  );
}

async function load() {

  try {

    const response =
      await fetch(
        `/api/public/payment-links/${encodeURIComponent(
          token
        )}`,
        {
          credentials:
            "include"
        }
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "Link inválido."
      );
    }

    paymentData =
      data;

    const merchantName =
      data.merchant?.businessName ||
      data.merchant?.name ||
      "Honey Pay";

    $("merchant")
      .textContent =
      merchantName;

    $("title")
      .textContent =
      data.link.title;

    $("description")
      .textContent =
      data.link.description ||
      "";

    $("amount")
      .textContent =
      formatKz(
        data.link.amount
      );

    renderQr(
      `${location.origin}/pay/${encodeURIComponent(
        token
      )}`
    );

  } catch (
    error
  ) {

    $("checkout")
      .innerHTML = `
        <h1>
          Pagamento indisponível
        </h1>

        <p>
          ${escapeHTML(
            error.message
          )}
        </p>
      `;
  }
}

/* =========================================================
   QR
========================================================= */

function renderQr(
  value
) {

  const container =
    $("qrContainer");

  if (!container) {
    return;
  }

  const img =
    document.createElement(
      "img"
    );

  img.alt =
    "QR Code de pagamento Honey Pay";

  img.loading =
    "eager";

  img.style.width =
    "220px";

  img.style.height =
    "220px";

  img.style.maxWidth =
    "100%";

  /*
   Serviço externo apenas para representação
   visual do QR.
   O conteúdo codificado é exclusivamente
   o URL público Honey Pay.
  */

  img.src =
    `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(
      value
    )}`;

  container.innerHTML =
    "";

  container.appendChild(
    img
  );
}

/* =========================================================
   PAYMENT
========================================================= */

$("paymentForm")
  .addEventListener(
    "submit",
    async (
      event
    ) => {

      event.preventDefault();

      const button =
        $("payButton");

      button.disabled =
        true;

      button.textContent =
        "A processar...";

      $("message")
        .className =
        "message";

      $("message")
        .textContent =
        "A criar pagamento seguro...";

      try {

        const response =
          await fetch(
            `/api/public/payment-links/${encodeURIComponent(
              token
            )}/pay`,
            {
              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json",

                Accept:
                  "application/json"
              },

              body:
                JSON.stringify({

                  paymentMethod:
                    $("paymentMethod")
                      .value,

                  customerName:
                    $("customerName")
                      .value
                      .trim(),

                  customerEmail:
                    $("customerEmail")
                      .value
                      .trim(),

                  customerMobile:
                    $("customerMobile")
                      .value
                      .trim()
                })
            }
          );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "Não foi possível criar o pagamento."
          );
        }

        currentPayment =
          data.payment;

        renderPayment(
          data.payment
        );

        startPaymentStream(
          data.payment
            .providerPaymentId
        );

      } catch (
        error
      ) {

        $("message")
          .className =
          "message error";

        $("message")
          .textContent =
          error.message;

        button.disabled =
          false;

        button.textContent =
          "Tentar novamente";
      }
    }
  );

/* =========================================================
   PAYMENT VIEW
========================================================= */

function renderPayment(
  payment
) {

  const status =
    String(
      payment.status ||
      "PENDING"
    ).toUpperCase();

  let html = `
    <div class="payment-status">

      <strong>
        ${escapeHTML(
          statusLabel(
            status
          )
        )}
      </strong>

      <br><br>

      Valor:
      <strong>
        ${formatKz(
          payment.amount
        )}
      </strong>

      <br><br>
  `;

  if (
    payment.multicaixaReference &&
    (
      payment.multicaixaReference.entity ||
      payment.multicaixaReference.number
    )
  ) {

    html += `
      <div class="reference">

        <strong>
          Referência Multicaixa
        </strong>

        <br><br>

        Entidade:
        <strong>
          ${escapeHTML(
            payment
              .multicaixaReference
              .entity
          )}
        </strong>

        <br>

        Número:
        <strong>
          ${escapeHTML(
            payment
              .multicaixaReference
              .number
          )}
        </strong>

      </div>
    `;
  }

  if (
    payment.checkoutUrl
  ) {

    html += `
      <br>

      <a
        href="${escapeHTML(
          payment.checkoutUrl
        )}"
        target="_blank"
        rel="noopener noreferrer"
      >
        Abrir checkout BitPay
      </a>
    `;
  }

  html += `

      <br><br>

      <span id="liveStatus">
        A aguardar confirmação...
      </span>

    </div>
  `;

  $("message")
    .className =
    "message success";

  $("message")
    .innerHTML =
    html;

  $("paymentForm")
    .style.display =
    "none";
}

/* =========================================================
   REAL-TIME BITPAY
========================================================= */

function startPaymentStream(
  providerPaymentId
) {

  if (
    !providerPaymentId
  ) {
    return;
  }

  let attempts =
    0;

  const maxAttempts =
    120;

  const check =
    async () => {

      try {

        const response =
          await fetch(
            `/api/public/payments/${encodeURIComponent(
              providerPaymentId
            )}/status`,
            {
              cache:
                "no-store"
            }
          );

        const data =
          await response.json();

        if (
          !response.ok
        ) {
          throw new Error(
            data.error ||
            "Erro ao consultar pagamento."
          );
        }

        const payment =
          data.payment;

        const status =
          String(
            payment.status ||
            ""
          ).toUpperCase();

        const live =
          $("liveStatus");

        if (
          status ===
            "PAID"
        ) {

          if (live) {

            live.innerHTML = `
              <strong>
                ✓ Pagamento confirmado.
              </strong>
            `;
          }

          return;
        }

        if (
          status ===
            "FAILED"
        ) {

          if (live) {

            live.textContent =
              "O pagamento falhou.";
          }

          return;
        }

        if (
          status ===
            "REFUNDED"
        ) {

          if (live) {

            live.textContent =
              "O pagamento foi reembolsado.";
          }

          return;
        }

        if (live) {

          live.textContent =
            status ===
              "PROCESSING"

              ? "Pagamento em processamento..."

              : "A aguardar confirmação...";
        }

        attempts++;

        if (
          attempts <
          maxAttempts
        ) {

          setTimeout(
            check,
            3000
          );
        }

      } catch (
        error
      ) {

        console.warn(
          "Payment status:",
          error
        );

        attempts++;

        if (
          attempts <
          maxAttempts
        ) {

          setTimeout(
            check,
            5000
          );
        }
      }
    };

  check();
}
  {

  if (
    !providerPaymentId
  ) {
    return;
  }

  if (
    eventSource
  ) {
    try {
      eventSource.close();
    } catch {}
  }

  const streamUrl =
    `https://api-sandbox.bitpay.ao/v1/public/payments/${encodeURIComponent(
      providerPaymentId
    )}/events`;

  /*
   Em produção, o BITPAY_BASE_URL deve ser
   api.bitpay.ao/v1.

   O browser não recebe a secret key.
   O endpoint público SSE da BitPay é usado
   apenas para acompanhar o pagamento.
  */

  try {

    eventSource =
      new EventSource(
        streamUrl
      );

    eventSource.addEventListener(
      "payment.succeeded",
      (
        event
      ) => {

        let data = {};

        try {
          data =
            JSON.parse(
              event.data
            );
        } catch {}

        markPaymentSucceeded(
          data
        );
      }
    );

    eventSource.addEventListener(
      "payment.failed",
      (
        event
      ) => {

        let data = {};

        try {
          data =
            JSON.parse(
              event.data
            );
        } catch {}

        markPaymentFailed(
          data
        );
      }
    );

    eventSource.onerror =
      () => {

        /*
         Não marcamos como pago.
         O webhook continua sendo a fonte
         definitiva de verdade.
        */

        const live =
          $("liveStatus");

        if (live) {
          live.textContent =
            "A aguardar confirmação do pagamento...";
        }
      };

  } catch (
    error
  ) {

    console.warn(
      "SSE:",
      error
    );
  }
}

function markPaymentSucceeded(
  data
) {

  if (
    eventSource
  ) {
    eventSource.close();
  }

  const live =
    $("liveStatus");

  if (live) {

    live.innerHTML = `
      <strong>
        ✓ Pagamento confirmado.
      </strong>
    `;
  }
}

function markPaymentFailed(
  data
) {

  if (
    eventSource
  ) {
    eventSource.close();
  }

  const live =
    $("liveStatus");

  if (live) {

    live.textContent =
      "O pagamento não foi concluído.";
  }
}

/* =========================================================
   START
========================================================= */

load();

</script>

</body>
</html>
