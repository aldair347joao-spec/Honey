<!doctype html>
<html lang="pt-PT">
<head>

<title>Honey Pay — Painel</title>
<meta name="description" content="Honey Pay — pagamentos e cobranças para comerciantes">
<link rel="stylesheet" href="/style.css">

<div id="appLoader"><div class="loader-card"><div class="logo">H</div><strong>Honey Pay</strong><span>A carregar painel...</span><div class="loader-line"></div></div></div>

<script src="/app.js" defer></script>
