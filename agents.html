<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honey IA — Agents Studio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%%3E<text y=%22.9em%22 font-size=%2290%%3E🐝</text></svg>">
    <link rel="stylesheet" href="agents.css">
</head>

<body>

<div class="agents-page">

    <!-- HEADER -->
    <header class="agents-header">
        <div class="brand">
            <span class="logo">🐝</span>
            <div>
                <h1>Honey IA Agents Studio</h1>
                <p>Agentes inteligentes especializados</p>
            </div>
        </div>

        <div class="agent-status">
            <span class="status-dot"></span>
            Sistema Online
        </div>
    </header>

    <!-- HERO -->
    <section class="agents-hero">
        <h2>Escolha o seu especialista IA</h2>
        <p>Cada agente possui uma identidade, memória e ferramentas próprias.</p>
    </section>

    <!-- AGENTS GRID -->
    <main id="agentsContainer" class="agents-grid">
        <!-- Os agentes serão carregados automaticamente pelo agentsUI.js -->
    </main>

    <!-- ACTIVE AGENT PANEL -->
    <section id="activeAgentPanel" class="active-agent hidden">
        <div class="active-header">
            <span id="activeEmoji">🐝</span>
            <div>
                <h3 id="activeName">Honey Assistant</h3>
                <p id="activeRole">Assistente geral</p>
            </div>
        </div>

        <div class="active-actions">
            <button id="btnAgentChat">💬 Abrir Chat</button>
            <button id="btnAgentLive">🎙️ Iniciar Live</button>
        </div>
    </section>

</div>

<script type="module" src="./agents-ui.js"></script>


</body>
</html>
