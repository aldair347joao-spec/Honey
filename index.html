<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Honey IA — Inteligência de Alta Performance</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b0c10;
      --bg-card: #12141c;
      --bg-input: #1a1d28;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --text-main: #edf5e1;
      --text-muted: #8892b0;
      --border-subtle: rgba(212, 175, 55, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image: radial-gradient(circle at 50% -10%, rgba(212, 175, 55, 0.12), transparent 60%);
    }

    /* Cabeçalho Premium */
    header {
      width: 100%;
      max-width: 900px;
      padding: 1.5rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-b: 1px solid rgba(255, 255, 255, 0.05);
    }

    .brand-logo {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--text-main);
    }

    .brand-logo span {
      color: var(--gold-primary);
    }

    .status-badge {
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: var(--gold-primary);
      background: rgba(212, 175, 55, 0.1);
      padding: 0.35rem 0.8rem;
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: var(--gold-primary);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--gold-primary);
    }

    /* Contentor Principal */
    main {
      width: 100%;
      max-width: 900px;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem;
      gap: 1.5rem;
    }

    /* Caixa de Chat */
    #chat-container {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 1.5rem;
      overflow-y: auto;
      max-height: 65vh;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .message {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      max-width: 85%;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .message.user {
      align-self: flex-end;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 0.8rem 1.2rem;
      border-radius: 12px 12px 2px 12px;
      color: #fff;
    }

    .message.assistant {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 1rem 1.2rem;
      border-radius: 12px 12px 12px 2px;
      white-space: pre-wrap;
    }

    .message-author {
      font-size: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    /* Formulário de Envio */
    #chat-form {
      display: flex;
      gap: 0.8rem;
      background: var(--bg-card);
      padding: 0.6rem;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.5rem 0.8rem;
    }

    #user-input::placeholder {
      color: var(--text-muted);
    }

    button {
      background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
      border: none;
      color: #000;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 1px;
      padding: 0.8rem 1.6rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      opacity: 0.9;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Scrollbar personalizada */
    #chat-container::-webkit-scrollbar {
      width: 6px;
    }
    #chat-container::-webkit-scrollbar-track {
      background: transparent;
    }
    #chat-container::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.2);
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-logo">HONEY <span>IA</span></div>
    <div class="status-badge">
      <div class="status-dot"></div>
      STREAMING ACTIVO
    </div>
  </header>

  <main>
    <div id="chat-container">
      <div class="message assistant">
        <div class="message-author">Honey IA</div>
        Olá! A infraestrutura de streaming em tempo real está operacional. Como posso ajudar o teu projeto hoje?
      </div>
    </div>

    <form id="chat-form">
      <input 
        type="text" 
        id="user-input" 
        placeholder="Escreve a tua mensagem aqui..." 
        autocomplete="off" 
        required 
      />
      <button type="submit" id="send-btn">ENVIAR</button>
    </form>
  </main>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    // Histórico local de mensagens da conversa
    const historico = [];

    // Função para rolar automaticamente para o final da caixa de chat
    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Adiciona uma bolha de mensagem à interface
    function adicionarMensagem(autor, texto, classe) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', classe);

      const authorDiv = document.createElement('div');
      authorDiv.classList.add('message-author');
      authorDiv.textContent = autor;

      const contentDiv = document.createElement('div');
      contentDiv.classList.add('message-text');
      contentDiv.textContent = texto;

      msgDiv.appendChild(authorDiv);
      msgDiv.appendChild(contentDiv);
      chatContainer.appendChild(msgDiv);

      scrollToBottom();
      return contentDiv; // Retorna o elemento de texto para podermos atualizar token a token
    }

    // Consumidor da API de Streaming (SSE)
    async function pedirRespostaHoneyIA(mensagens, modoJSON = false, aoReceberToken) {
      try {
        const resposta = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: mensagens, jsonMode: modoJSON })
        });

        if (!resposta.ok) {
          throw new Error(`Erro na rede: ${resposta.statusText}`);
        }

        const leitor = resposta.body.getReader();
        const decodificador = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
          const { done, value } = await leitor.read();
          if (done) break;

          buffer += decodificador.decode(value, { stream: true });
          const blocos = buffer.split('\n\n');
          buffer = blocos.pop(); // Guarda pedaços de mensagens incompletas no buffer

          for (const bloco of blocos) {
            if (bloco.startsWith('data: ')) {
              const dado = bloco.replace('data: ', '').trim();
              if (dado === '[DONE]') return;

              try {
                const objeto = JSON.parse(dado);
                if (objeto.content) {
                  aoReceberToken(objeto.content);
                }
              } catch (e) {
                console.error('Erro ao processar fragmento JSON:', e);
              }
            }
          }
        }
      } catch (erro) {
        console.error('Erro ao conectar ao servidor:', erro);
        throw erro;
      }
    }

    // Manipulador do envio do formulário
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const texto = userInput.value.trim();
      if (!texto) return;

      userInput.value = '';
      userInput.disabled = true;
      sendBtn.disabled = true;

      // Renderiza a mensagem do utilizador
      adicionarMensagem('Tu', texto, 'user');
      historico.push({ role: 'user', content: texto });

      // Cria a bolha da IA vazia para receber o streaming
      const elementoTextoIA = adicionarMensagem('Honey IA', '', 'assistant');
      let respostaCompleta = '';

      try {
        await pedirRespostaHoneyIA(historico, false, (token) => {
          respostaCompleta += token;
          elementoTextoIA.textContent = respostaCompleta;
          scrollToBottom();
        });

        historico.push({ role: 'assistant', content: respostaCompleta });
      } catch (erro) {
        elementoTextoIA.textContent = '[Erro de conexão: Não foi possível obter a resposta da Honey IA.]';
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    });
  </script>
</body>
</html>
