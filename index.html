<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Honey IA</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#090a0f">
    
    <!-- Google Fonts & Marked -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-body: #090a0f;
            --bg-surface: #12141c;
            --bg-card: #181b26;
            --border: #232736;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --primary-glow: rgba(245, 158, 11, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            height: 100dvh; /* Garante ajuste perfeito com a barra do navegador mobile */
            background-color: var(--bg-body);
            color: var(--text-main);
            overflow: hidden;
        }

        .app-layout {
            display: flex;
            width: 100vw;
            height: 100%;
            height: 100dvh;
            position: relative;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 50;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
        }

        .sidebar-header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1rem;
        }

        .btn-new {
            margin: 12px;
            padding: 10px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .history-container {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px;
        }

        .history-item {
            padding: 8px 10px;
            margin-bottom: 4px;
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 0.825rem;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- MAIN CONTENT --- */
        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            height: 100dvh;
            width: 100%;
            position: relative;
        }

        /* --- HEADER --- */
        .header {
            height: 52px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background-color: var(--bg-body);
            flex-shrink: 0;
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Seletores de modo deslizáveis horizontalmente */
        .mode-bar {
            display: flex;
            gap: 4px;
            background-color: var(--bg-surface);
            padding: 3px;
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow-x: auto;
            scrollbar-width: none;
            max-width: calc(100vw - 70px);
        }

        .mode-bar::-webkit-scrollbar {
            display: none;
        }

        .mode-chip {
            padding: 4px 10px;
            border: none;
            background: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .mode-chip.active {
            background-color: var(--primary);
            color: #000;
        }

        /* --- CHAT VIEWPORT --- */
        .chat-viewport {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chat-box {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: auto 0;
        }

        /* --- WELCOME HERO --- */
        .hero {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .hero-badge {
            width: 48px;
            height: 48px;
            background: var(--primary-glow);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .hero h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Lista de sugestões verticais no mobile (evita cortes) */
        .suggestions-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .suggestion-item {
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: border-color 0.2s;
        }

        .suggestion-item:active {
            border-color: var(--primary);
        }

        .suggestion-item h4 {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .suggestion-item p {
            font-size: 0.725rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* --- CHAT MESSAGES --- */
        .msg {
            display: flex;
            width: 100%;
        }

        .msg.user {
            justify-content: flex-end;
        }

        .msg-bubble {
            max-width: 88%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.45;
        }

        .msg.user .msg-bubble {
            background-color: var(--primary);
            color: #000;
            font-weight: 500;
            border-bottom-right-radius: 2px;
        }

        .msg.assistant .msg-bubble {
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-bottom-left-radius: 2px;
        }

        .msg-bubble pre {
            background-color: #000;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 8px 0;
            font-size: 0.8rem;
        }

        /* --- FOOTER / INPUT DOCK --- */
        .input-dock {
            padding: 8px 12px 12px 12px;
            background-color: var(--bg-body);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            justify-content: center;
        }

        .input-wrapper {
            width: 100%;
            max-width: 680px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
        }

        .input-wrapper textarea {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 0.875rem;
            resize: none;
            max-height: 100px;
            min-height: 36px;
            padding: 8px 0;
        }

        .btn-send {
            background-color: var(--primary);
            color: #000;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            flex-shrink: 0;
        }

        .overlay {
            display: none;
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 40;
        }

        .overlay.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand-title">
                    <span>🐝</span>
                    <span>Honey IA</span>
                </div>
                <button class="btn-icon" onclick="toggleSidebar()">✕</button>
            </div>

            <button class="btn-new" onclick="startNewChat()">
                <span>+</span> Nova Conversa
            </button>

            <div class="history-container" id="historyContainer">
                <!-- Histórico de Conversas -->
            </div>
        </aside>

        <!-- MAIN PANEL -->
        <main class="main-panel">
            <!-- HEADER -->
            <header class="header">
                <button class="btn-icon" onclick="toggleSidebar()">
                    <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                </button>

                <div class="mode-bar">
                    <button class="mode-chip active" onclick="setMode('general', this)">🐝 Geral</button>
                    <button class="mode-chip" onclick="setMode('dev', this)">💻 Dev</button>
                    <button class="mode-chip" onclick="setMode('designer', this)">🎨 Designer</button>
                    <button class="mode-chip" onclick="setMode('marketing', this)">📣 Marketing</button>
                </div>
            </header>

            <!-- CHAT VIEWPORT -->
            <div class="chat-viewport" id="chatViewport">
                <div class="chat-box" id="chatBox">
                    <div class="hero" id="hero">
                        <div class="hero-badge">🐝</div>
                        <h2>Como posso ajudar hoje?</h2>

                        <div class="suggestions-list">
                            <div class="suggestion-item" onclick="usePrompt('Crie uma landing page moderna para uma startup.')">
                                <h4>🌐 Site Comercial</h4>
                                <p>Criar estrutura de landing page persuasiva</p>
                            </div>
                            <div class="suggestion-item" onclick="usePrompt('Crie uma API RESTful em Node.js com Express.')">
                                <h4>💻 API Backend</h4>
                                <p>Gerar código limpo e arquitetura de rotas</p>
                            </div>
                            <div class="suggestion-item" onclick="usePrompt('Gere um prompt Midjourney para um logo futurista.')">
                                <h4>🎨 Prompt de Design</h4>
                                <p>Gerar prompt detalhado para arte de IA</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- INPUT DOCK -->
            <div class="input-dock">
                <div class="input-wrapper">
                    <button class="btn-icon" title="Anexar Ficheiro" onclick="document.getElementById('fileInput').click()">📎</button>
                    <input type="file" id="fileInput" hidden onchange="handleFileSelect(event)">
                    
                    <textarea id="promptInput" rows="1" placeholder="Escreva a sua mensagem..." oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
                    
                    <button class="btn-send" onclick="sendPrompt()">➔</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentMode = 'general';

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }

        function setMode(mode, el) {
            currentMode = mode;
            document.querySelectorAll('.mode-chip').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight) + 'px';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendPrompt();
            }
        }

        function usePrompt(text) {
            document.getElementById('promptInput').value = text;
            sendPrompt();
        }

        function startNewChat() {
            document.getElementById('chatBox').innerHTML = `
                <div class="hero" id="hero">
                    <div class="hero-badge">🐝</div>
                    <h2>Como posso ajudar hoje?</h2>
                </div>`;
            if (window.innerWidth <= 768) toggleSidebar();
        }

        async function sendPrompt() {
            const input = document.getElementById('promptInput');
            const text = input.value.trim();
            if (!text) return;

            const hero = document.getElementById('hero');
            if (hero) hero.remove();

            const chatBox = document.getElementById('chatBox');

            // Adiciona mensagem do utilizador
            chatBox.innerHTML += `
                <div class="msg user">
                    <div class="msg-bubble">${text}</div>
                </div>`;

            input.value = '';
            input.style.height = 'auto';

            const viewport = document.getElementById('chatViewport');
            viewport.scrollTop = viewport.scrollHeight;

            try {
                const response = await fetch('/gerar-gratis', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text, modo: currentMode })
                });

                const data = await response.json();
                const replyText = data.sucesso ? data.resposta : (data.erro || 'Erro ao obter resposta.');

                chatBox.innerHTML += `
                    <div class="msg assistant">
                        <div class="msg-bubble">${marked.parse(replyText)}</div>
                    </div>`;
                viewport.scrollTop = viewport.scrollHeight;
            } catch (err) {
                chatBox.innerHTML += `
                    <div class="msg assistant">
                        <div class="msg-bubble">Erro ao conectar com o servidor.</div>
                    </div>`;
            }
        }

        function handleFileSelect(e) {
            if (e.target.files.length > 0) {
                alert("Ficheiro selecionado: " + e.target.files[0].name);
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW error:', err));
            });
        }
    </script>
</body>
</html>
