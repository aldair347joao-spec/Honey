<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Honey IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-main: #0d0f12;
            --bg-sidebar: #16181d;
            --bg-card: #1e2026;
            --bg-input: #1e2026;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --accent: #f59e0b;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: var(--bg-main);
            color: var(--text-primary);
            overflow: hidden;
        }

        .app-layout {
            display: flex;
            height: 100dvh;
            width: 100vw;
            position: relative;
        }

        /* Overlay escuro para quando a sidebar estiver aberta */
        .sidebar-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 9;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* Sidebar Retrátil / Ocultável */
        .sidebar {
            position: absolute;
            top: 0;
            bottom: 0;
            left: -280px;
            width: 280px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            transition: transform 0.3s ease;
            z-index: 10;
        }

        .sidebar.open {
            transform: translateX(280px);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: 800;
        }

        .close-sidebar-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
        }

        .new-chat-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .history-section {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.84rem;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover, .history-item.active {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        /* Área Principal */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            height: 100%;
            width: 100%;
        }

        .top-bar {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .toggle-sidebar-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .toggle-sidebar-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .app-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 120px 16px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Apresentação Inicial Minimalista */
        .hero-section {
            margin: auto 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .hero-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .hero-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            max-width: 480px;
            line-height: 1.4;
        }

        .suggestion-grid {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 12px;
        }

        .suggestion-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion-card:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        /* Caixa de Input Centralizada */
        .input-wrapper {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: linear-gradient(to top, var(--bg-main) 80%, transparent);
            display: flex;
            justify-content: center;
        }

        .input-box {
            max-width: 800px;
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-box:focus-within {
            border-color: rgba(255, 255, 255, 0.25);
        }

        .chat-textarea {
            width: 100%;
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            resize: none;
            max-height: 120px;
            line-height: 1.4;
        }

        .chat-textarea::placeholder {
            color: var(--text-secondary);
        }

        .input-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tools-left {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .send-btn {
            background: var(--text-primary);
            color: #000;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* Ficheiros Anexados */
        .file-preview {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .file-chip {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-subtle);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Bolhas de Mensagem */
        .message {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .message.user {
            align-self: flex-end;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            padding: 12px 16px;
            border-radius: 16px 16px 2px 16px;
            max-width: 85%;
            font-size: 0.92rem;
        }

        .message.ai {
            align-self: flex-start;
            width: 100%;
            font-size: 0.94rem;
            line-height: 1.6;
            color: var(--text-primary);
        }

        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
        }

        .markdown-body th, .markdown-body td {
            border: 1px solid var(--border-subtle);
            padding: 8px 12px;
            text-align: left;
            font-size: 0.84rem;
        }

        .markdown-body pre {
            background: #121417;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
            margin: 10px 0;
        }

        .markdown-body code {
            font-family: monospace;
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Overlay escuro para fechar o menu ao clicar fora -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

        <!-- Menu Lateral Oculto por padrão -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-icon">🐝</div>
                    <span>Honey IA</span>
                </div>
                <button class="close-sidebar-btn" onclick="toggleSidebar()">✕</button>
            </div>
            
            <button class="new-chat-btn" onclick="resetToHome()">
                <span>＋</span> Nova conversa
            </button>

            <div class="history-section" id="historyList"></div>
        </aside>

        <!-- Área Principal Limpa -->
        <main class="main-content">
            <header class="top-bar">
                <button class="toggle-sidebar-btn" onclick="toggleSidebar()">☰</button>
                <div class="app-title">Honey IA</div>
            </header>

            <div class="chat-container" id="chatContainer">
                <div class="hero-section" id="heroView">
                    <h1 class="hero-title">Como posso ajudar a sua empresa hoje?</h1>
                    <p class="hero-subtitle">Estou aqui para criar sites, apps, logótipos, flyers e vídeos publicitários para impulsionar o seu negócio com carinho.</p>
                    
                    <div class="suggestion-grid">
                        <div class="suggestion-card" onclick="selectPrompt('Criar código para um site comercial responsivo')">🌐 Site Comercial</div>
                        <div class="suggestion-card" onclick="selectPrompt('Desenvolver a estrutura de um aplicativo premium')">📱 App Premium</div>
                        <div class="suggestion-card" onclick="selectPrompt('Criar conceito e prompt para um logotipo corporativo')">🎨 Criar Logótipo</div>
                        <div class="suggestion-card" onclick="selectPrompt('Criar roteiro para vídeo publicitário e flyer comercial')">📣 Flyer & Vídeo</div>
                    </div>
                </div>
            </div>

            <div class="input-wrapper">
                <div class="input-box">
                    <div class="file-preview" id="filePreviewList"></div>
                    <textarea class="chat-textarea" id="mainInput" placeholder="Descreva o que a sua empresa precisa..." rows="1"></textarea>
                    
                    <div class="input-controls">
                        <div class="tools-left">
                            <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Anexar ficheiro ou imagem">
                                📎
                            </button>
                            <input type="file" id="fileInput" style="display: none;" multiple>
                        </div>
                        <button class="send-btn" id="submitBtn">➔</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let sessions = JSON.parse(localStorage.getItem('honey_sessions')) || [];
        let uploadedFilesObjects = [];
        let currentSessionId = null;

        const mainInput = document.getElementById('mainInput');
        const chatContainer = document.getElementById('chatContainer');
        const heroView = document.getElementById('heroView');
        const fileInput = document.getElementById('fileInput');
        const filePreviewList = document.getElementById('filePreviewList');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('active');
        }

        fileInput.addEventListener('change', (e) => {
            Array.from(e.target.files).forEach(file => uploadedFilesObjects.push(file));
            renderFiles();
        });

        function renderFiles() {
            filePreviewList.innerHTML = '';
            uploadedFilesObjects.forEach((file, idx) => {
                const chip = document.createElement('div');
                chip.className = 'file-chip';
                chip.innerHTML = `📄 ${file.name} <span style="cursor:pointer;" onclick="removeFile(${idx})">✕</span>`;
                filePreviewList.appendChild(chip);
            });
        }

        function removeFile(idx) {
            uploadedFilesObjects.splice(idx, 1);
            renderFiles();
        }

        function selectPrompt(text) {
            mainInput.value = text;
            mainInput.focus();
        }

        function resetToHome() {
            currentSessionId = null;
            heroView.style.display = 'flex';
            document.querySelectorAll('.message').forEach(m => m.remove());
            mainInput.value = '';
            uploadedFilesObjects = [];
            renderFiles();
            renderHistory();
            if(sidebar.classList.contains('open')) toggleSidebar();
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        async function sendMessage() {
            const text = mainInput.value.trim();
            if (!text && uploadedFilesObjects.length === 0) return;

            heroView.style.display = 'none';

            // Mensagem do Utilizador
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text || "Análise de documento";
            chatContainer.appendChild(userMsg);

            // Mensagem da IA
            const aiMsg = document.createElement('div');
            aiMsg.className = 'message ai markdown-body';
            aiMsg.innerHTML = '<em>A preparar uma resposta especial para si...</em>';
            chatContainer.appendChild(aiMsg);

            mainInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                let payload = { prompt: text };

                if (uploadedFilesObjects.length > 0) {
                    const file = uploadedFilesObjects[0];
                    payload.anexoBase64 = await fileToBase64(file);
                    payload.mimeType = file.type;
                    uploadedFilesObjects = [];
                    renderFiles();
                }

                const response = await fetch('/gerar-gratis', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.sucesso) {
                    aiMsg.innerHTML = typeof marked !== 'undefined' ? marked.parse(data.resposta) : data.resposta;
                    saveSession(text || "Consulta de ficheiro", text, data.resposta);
                } else {
                    aiMsg.innerHTML = `<span style="color:#ef4444;">Erro: ${data.erro}</span>`;
                }
            } catch (err) {
                aiMsg.innerHTML = `<span style="color:#ef4444;">Falha de ligação ao servidor. Por favor, verifique a sua conexão.</span>`;
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function saveSession(title, query, response) {
            if (!currentSessionId) {
                currentSessionId = 'sess_' + Date.now();
                sessions.unshift({ id: currentSessionId, title: title.substring(0, 24), query, response });
            }
            localStorage.setItem('honey_sessions', JSON.stringify(sessions));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            sessions.forEach(s => {
                const item = document.createElement('div');
                item.className = `history-item ${s.id === currentSessionId ? 'active' : ''}`;
                item.innerHTML = `💬 ${s.title}`;
                item.onclick = () => loadSession(s.id);
                list.appendChild(item);
            });
        }

        function loadSession(id) {
            const s = sessions.find(item => item.id === id);
            if (!s) return;
            currentSessionId = s.id;
            heroView.style.display = 'none';
            document.querySelectorAll('.message').forEach(m => m.remove());

            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = s.query;
            chatContainer.appendChild(userMsg);

            const aiMsg = document.createElement('div');
            aiMsg.className = 'message ai markdown-body';
            aiMsg.innerHTML = typeof marked !== 'undefined' ? marked.parse(s.response) : s.response;
            chatContainer.appendChild(aiMsg);

            renderHistory();
            if(sidebar.classList.contains('open')) toggleSidebar();
        }

        document.getElementById('submitBtn').addEventListener('click', sendMessage);
        mainInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        renderHistory();
    </script>
</body>
</html>
