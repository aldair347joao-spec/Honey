<!DOCTYPE html>
<html lang="pt-PT">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Honey AI OS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar">

<div class="logo">

🐝 Honey AI

</div>

<button id="newChat">

＋ Nova conversa

</button>

<div id="history">

<!-- Histórico -->

</div>

<div class="bottom">

<button id="pluginsBtn">

🧩 Plugins

</button>

<button id="settingsBtn">

⚙ Configurações

</button>

</div>

</aside>

<!-- ÁREA PRINCIPAL -->

<main class="main">

<header>

<div class="title">

Honey AI OS

</div>

<div class="status">

<span class="dot"></span>

Online

</div>

</header>

<section id="messages">

<div class="assistant">

<div class="avatar">

🐝

</div>

<div class="bubble">

Olá!

Sou a nova Honey AI.

Como posso ajudar você hoje?

</div>

</div>

</section>

<footer>

<div class="inputBox">

<textarea

id="prompt"

placeholder="Digite sua mensagem..."

rows="1">

</textarea>

<div class="toolbar">

<button id="upload">

📁

</button>

<button id="voice">

🎤

</button>

<button id="send">

➜

</button>

</div>

</div>

</footer>

</main>

</div>

<script src="app.js"></script>

</body>

</html>
