<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d0f12">
    <meta name="description" content="Honey IA - A sua assistente carinhosa para criação de sites, apps, logótipos e publicidade empresarial.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Honey IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-main: #0d0f12;
            --bg-sidebar: #16181d;
            --bg-card: #1e2026;
            --bg-input: #1e2026;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --accent: #f59e0b;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: var(--bg-main);
            color: var(--text-primary);
            overflow: hidden;
        }

        .app-layout {
            display: flex;
            height: 100dvh;
            width: 100vw;
            position: relative;
        }

        .sidebar-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 9;
        }

        .sidebar-overlay.active {
            display: block;
        }

        .sidebar {
            position: absolute;
            top: 0; bottom: 0; left: -280px;
            width: 280px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            transition: transform 0.3s ease;
            z-index: 10;
        }

        .sidebar.open {
            transform: translateX(280px);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: 800;
        }

        .close-sidebar-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
        }

        .new-chat-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .history-section {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.84rem;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover, .history-item.active {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            height: 100%;
            width: 100%;
        }

        .top-bar {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .toggle-sidebar-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .toggle-sidebar-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .app-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 140px 16px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hero-section {
            margin: auto 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .hero-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .hero-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            max-width: 480px;
            line-height: 1.4;
        }

        .suggestion-grid {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 12px;
        }

        .suggestion-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion-card:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .input-wrapper {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 16px;
            background: linear-gradient(to top, var(--bg-main) 80%, transparent);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .quick-actions-bar {
            display: flex;
            gap: 6px;
            max-width: 800px;
            width: 100%;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .action-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-size: 0.74rem;
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .action-chip:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .input-box {
            max-width: 800px;
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-box:focus-within {
            border-color: rgba(255, 255, 255, 0.25);
        }

        .chat-textarea {
            width: 100%;
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            resize: none;
            max-height: 120px;
            line-height: 1.4;
        }

        .chat-textarea::placeholder {
            color: var(--text-secondary);
        }

        .input-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tools-left {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .send-btn {
            background: var(--text-primary);
            color: #000;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .file-preview {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .file-chip {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-subtle);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .message {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message.user {
            align-self: flex-end;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            padding: 12px 16px;
            border-radius: 16px 16px 2px 16px;
            max-width: 85%;
            font-size: 0.92rem;
        }

        .message.ai {
            align-self: flex-start;
            width: 100%;
            font-size: 0.94rem;
            line-height: 1.6;
            color: var(--text-primary);
        }

        .ai-footer-tools {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .export-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-size: 0.72rem;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .export-btn:hover {
            color: var(--text-primary);
            border-color: var(--accent);
        }

        .code-wrapper {
            position: relative;
            margin: 12px 0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            background: #121417;
        }

        .code-wrapper.prompt-card {
            border-color: rgba(245, 158, 11, 0.3);
            background: rgba(245, 158, 11, 0.03);
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1d24;
            padding: 6px 12px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .code-wrapper.prompt-card .code-header {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent);
            font-weight: 600;
        }

        .code-actions {
            display: flex;
            gap: 8px;
        }

        .code-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-primary);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.72rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .code-btn:hover {
            background: var(--accent);
            color: #000;
        }

        .markdown-body pre {
            padding: 12px;
            overflow-x: auto;
            margin: 0;
            background: transparent;
        }

        .markdown-body code {
            font-family: monospace;
            color: #38bdf8;
        }

        .preview-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            flex-direction: column;
        }

        .preview-modal.active {
            display: flex;
        }

        .preview-header {
            background: var(--bg-sidebar);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
        }

        .preview-iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-icon">🐝</div>
                    <span>Honey IA</span>
                </div>
                <button class="close-sidebar-btn" onclick="toggleSidebar()">✕</button>
            </div>
            
            <button class="new-chat-btn" onclick="resetToHome()">
                <span>＋</span> Nova conversa
            </button>

            <div class="history-section" id="historyList"></div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <button class="toggle-sidebar-btn" onclick="toggleSidebar()">☰</button>
                <div class="app-title">Honey IA</div>
            </header>

            <div class="chat-container" id="chatContainer">
                <div class="hero-section" id="heroView">
                    <h1 class="hero-title">Como posso ajudar a sua empresa hoje?</h1>
                    <p class="hero-subtitle">Estou aqui para criar sites, apps, logótipos, flyers e vídeos publicitários para impulsionar o seu negócio com carinho.</p>
                    
                    <div class="suggestion-grid">
                        <div class="suggestion-card" onclick="selectPrompt('Criar código para um site comercial responsivo completo com HTML e CSS')">🌐 Site Comercial</div>
                        <div class="suggestion-card" onclick="selectPrompt('Desenvolver a estrutura de um aplicativo premium')">📱 App Premium</div>
                        <div class="suggestion-card" onclick="selectPrompt('Criar conceito e prompt para um logotipo corporativo')">🎨 Criar Logótipo</div>
                        <div class="suggestion-card" onclick="selectPrompt('Criar roteiro para vídeo publicitário e flyer comercial')">📣 Flyer & Vídeo</div>
                    </div>
                </div>
            </div>

            <div class="input-wrapper">
                <div class="quick-actions-bar">
                    <button class="action-chip" onclick="quickAction('Explique com mais detalhes e passos práticos.')">🔍 Expandir Detalhes</button>
                    <button class="action-chip" onclick="quickAction('Traduza os termos e o prompt para Inglês.')">🇬🇧 Traduzir p/ Inglês</button>
                    <button class="action-chip" onclick="quickAction('Reescreva de forma mais persuasiva e comercial.')">✨ Mais Comercial</button>
                </div>

                <div class="input-box">
                    <div class="file-preview" id="filePreviewList"></div>
                    <textarea class="chat-textarea" id="mainInput" placeholder="Descreva o que a sua empresa precisa..." rows="1"></textarea>
                    
                    <div class="input-controls">
                        <div class="tools-left">
                            <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Anexar ficheiro ou imagem">
                                📎
                            </button>
                            <input type="file" id="fileInput" style="display: none;" multiple>
                        </div>
                        <button class="send-btn" id="submitBtn">➔</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="preview-modal" id="previewModal">
        <div class="preview-header">
            <span>👁️ Pré-visualização ao Vivo - Honey IA</span>
            <button class="code-btn" onclick="closePreview()">Fechar ✕</button>
        </div>
        <iframe class="preview-iframe" id="previewFrame"></iframe>
    </div>

    <script>
        let sessions = JSON.parse(localStorage.getItem('honey_sessions')) || [];
        let uploadedFilesObjects = [];
        let currentSessionId = null;

        const mainInput = document.getElementById('mainInput');
        const chatContainer = document.getElementById('chatContainer');
        const heroView = document.getElementById('heroView');
        const fileInput = document.getElementById('fileInput');
        const filePreviewList = document.getElementById('filePreviewList');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('active');
        }

        fileInput.addEventListener('change', (e) => {
            Array.from(e.target.files).forEach(file => uploadedFilesObjects.push(file));
            renderFiles();
        });

        function renderFiles() {
            filePreviewList.innerHTML = '';
            uploadedFilesObjects.forEach((file, idx) => {
                const chip = document.createElement('div');
                chip.className = 'file-chip';
                chip.innerHTML = `📄 ${file.name} <span style="cursor:pointer;" onclick="removeFile(${idx})">✕</span>`;
                filePreviewList.appendChild(chip);
            });
        }

        function removeFile(idx) {
            uploadedFilesObjects.splice(idx, 1);
            renderFiles();
        }

        function selectPrompt(text) {
            mainInput.value = text;
            mainInput.focus();
        }

        function quickAction(instruction) {
            if (!mainInput.value) {
                mainInput.value = instruction;
            } else {
                mainInput.value += ` (${instruction})`;
            }
            sendMessage();
        }

        function resetToHome() {
            currentSessionId = null;
            heroView.style.display = 'flex';
            document.querySelectorAll('.message').forEach(m => m.remove());
            mainInput.value = '';
            uploadedFilesObjects = [];
            renderFiles();
            renderHistory();
            if(sidebar.classList.contains('open')) toggleSidebar();
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        function downloadText(filename, text) {
            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
            element.setAttribute('download', filename);
            element.style.display = 'none';
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }

        function enhanceCodeBlocks(container, rawResponseText) {
            const preBlocks = container.querySelectorAll('pre');
            preBlocks.forEach((pre) => {
                if (pre.parentElement.classList.contains('code-wrapper')) return;

                const code = pre.querySelector('code');
                const rawCode = code ? code.innerText : pre.innerText;
                const langMatch = code ? code.className.match(/language-(\w+)/) : null;
                const lang = langMatch ? langMatch[1] : 'código';

                const wrapper = document.createElement('div');
                const isPromptCard = lang === 'prompt-imagem';
                wrapper.className = `code-wrapper ${isPromptCard ? 'prompt-card' : ''}`;

                const isHtml = lang === 'html' || rawCode.includes('<!DOCTYPE') || rawCode.includes('<html');

                const headerTitle = isPromptCard ? '🎨 PROMPT PARA GERADOR DE IMAGEM' : lang.toUpperCase();
                const copyBtnLabel = isPromptCard ? '📋 Copiar Prompt de Imagem' : '📋 Copiar';

                wrapper.innerHTML = `
                    <div class="code-header">
                        <span>${headerTitle}</span>
                        <div class="code-actions">
                            ${isHtml ? `<button class="code-btn preview-btn">👁️ Pré-visualizar</button>` : ''}
                            <button class="code-btn copy-btn">${copyBtnLabel}</button>
                        </div>
                    </div>
                `;

                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(pre);

                wrapper.querySelector('.copy-btn').addEventListener('click', () => {
                    navigator.clipboard.writeText(rawCode.trim());
                    const btn = wrapper.querySelector('.copy-btn');
                    btn.innerText = '✓ Copiado!';
                    setTimeout(() => btn.innerText = copyBtnLabel, 2000);
                });

                if (isHtml) {
                    wrapper.querySelector('.preview-btn').addEventListener('click', () => {
                        openPreview(rawCode);
                    });
                }
            });

            // Botão para exportar o texto da resposta
            const toolsDiv = document.createElement('div');
            toolsDiv.className = 'ai-footer-tools';
            toolsDiv.innerHTML = `<button class="export-btn">📥 Descarregar Resposta (.txt)</button>`;
            toolsDiv.querySelector('.export-btn').addEventListener('click', () => {
                downloadText('resposta-honey-ia.txt', rawResponseText);
            });
            container.appendChild(toolsDiv);
        }

        function openPreview(htmlCode) {
            const modal = document.getElementById('previewModal');
            const frame = document.getElementById('previewFrame');
            modal.classList.add('active');
            frame.srcdoc = htmlCode;
        }

        function closePreview() {
            document.getElementById('previewModal').classList.remove('active');
        }

        async function sendMessage() {
            const text = mainInput.value.trim();
            if (!text && uploadedFilesObjects.length === 0) return;

            heroView.style.display = 'none';

            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text || "Análise de documento";
            chatContainer.appendChild(userMsg);

            const aiMsg = document.createElement('div');
            aiMsg.className = 'message ai markdown-body';
            aiMsg.innerHTML = '<em>A preparar a resposta para o seu negócio...</em>';
            chatContainer.appendChild(aiMsg);

            mainInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                let payload = { prompt: text };

                if (uploadedFilesObjects.length > 0) {
                    const file = uploadedFilesObjects[0];
                    payload.anexoBase64 = await fileToBase64(file);
                    payload.mimeType = file.type;
                    uploadedFilesObjects = [];
                    renderFiles();
                }

                const response = await fetch('/gerar-gratis', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.sucesso) {
                    aiMsg.innerHTML = typeof marked !== 'undefined' ? marked.parse(data.resposta) : data.resposta;
                    enhanceCodeBlocks(aiMsg, data.resposta);
                    saveSession(text || "Consulta de ficheiro", text, data.resposta);
                } else {
                    aiMsg.innerHTML = `<span style="color:#ef4444;">Erro: ${data.erro}</span>`;
                }
            } catch (err) {
                aiMsg.innerHTML = `<span style="color:#ef4444;">Falha de ligação ao servidor. Por favor, tente novamente.</span>`;
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function saveSession(title, query, response) {
            if (!currentSessionId) {
                currentSessionId = 'sess_' + Date.now();
                sessions.unshift({ id: currentSessionId, title: title.substring(0, 24), query, response });
            }
            localStorage.setItem('honey_sessions', JSON.stringify(sessions));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            sessions.forEach(s => {
                const item = document.createElement('div');
                item.className = `history-item ${s.id === currentSessionId ? 'active' : ''}`;
                item.innerHTML = `💬 ${s.title}`;
                item.onclick = () => loadSession(s.id);
                list.appendChild(item);
            });
        }

        function loadSession(id) {
            const s = sessions.find(item => item.id === id);
            if (!s) return;
            currentSessionId = s.id;
            heroView.style.display = 'none';
            document.querySelectorAll('.message').forEach(m => m.remove());

            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = s.query;
            chatContainer.appendChild(userMsg);

            const aiMsg = document.createElement('div');
            aiMsg.className = 'message ai markdown-body';
            aiMsg.innerHTML = typeof marked !== 'undefined' ? marked.parse(s.response) : s.response;
            chatContainer.appendChild(aiMsg);
            enhanceCodeBlocks(aiMsg, s.response);

            renderHistory();
            if(sidebar.classList.contains('open')) toggleSidebar();
        }

        document.getElementById('submitBtn').addEventListener('click', sendMessage);
        mainInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        renderHistory();
    </script>
</body>
